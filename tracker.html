<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<style>
:root{
  --bg:#121316; --surface:#1B1D22; --surface-hi:#25282F; --line:#31343C;
  --text:#EDEBE4; --text-dim:#9A9CA6; --text-faint:#6B6E77;
  --legs:#E4572E; --chest:#3E8FD0; --back:#4C9A6B; --shoulders:#D4A24C;
  --arms:#A56CC1; --core:#C4485C; --cardio:#7A7D87;
  --up:#5CB37A; --down:#D9694F;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#121316;min-height:100vh;}
body,.wrap{font-family:'Inter',system-ui,sans-serif;}
h1,h2,.exname{font-family:'Bebas Neue',system-ui,sans-serif;letter-spacing:0.02em;}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
::-webkit-scrollbar{display:none;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
</head>
<body>

<div class="wrap" style="background:var(--bg);color:var(--text);padding:16px 16px 40px;max-width:600px;width:100%;margin:0 auto;min-height:100vh;">

  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;">
    <a href="index.html" style="display:inline-flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;flex:0 0 auto;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:0 1px 2px rgba(0,0,0,0.25);">
      <i class="ti ti-layout-grid" style="font-size:22px;color:var(--text-dim);"></i>
      <span style="font-family:'Bebas Neue',system-ui,sans-serif;font-size:24px;line-height:0.82;letter-spacing:0.02em;">Workout<br>Hub</span>
      <i class="ti ti-chevron-right" style="font-size:15px;color:var(--text-faint);"></i>
    </a>
    <div id="weekRing" style="text-align:right;"></div>
  </div>

  <div id="weekStrip" style="display:flex;gap:6px;margin-bottom:16px;"></div>

  <div id="dayTabs" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-ms-overflow-style:none;scrollbar-width:none;"></div>

  <div style="margin-bottom:8px;">
    <div id="planLabel" style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.12em;">Bulk</div>
    <h1 id="planTitle" style="font-size:28px;margin:0;line-height:1;">PHASE 2</h1>
  </div>

  <div id="sessionHeader" style="position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 12px;margin-bottom:2px;"></div>

  <textarea id="sessionNote" rows="1" placeholder="Add a note for today's session (energy, soreness, gym conditions...)" style="width:100%;background:var(--surface);border:0.5px solid var(--line);border-radius:10px;color:var(--text);font-size:12px;padding:8px 10px;margin-bottom:12px;resize:vertical;min-height:34px;font-family:'Inter',system-ui,sans-serif;"></textarea>

  <div id="exerciseList" style="display:flex;flex-direction:column;gap:10px;"></div>

  <div style="margin-top:18px;padding-top:14px;border-top:0.5px solid var(--line);">
    <div style="font-size:12px;color:var(--text-faint);">Log actual reps and weight per set. Weight carries forward until updated.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="phases.js"></script>
<script src="adhoc-config.js"></script>
<script>
/* ---- Firebase-backed session (per-account cloud data) ---- */
var PHASE = (location.search.match(/[?&]phase=(p[1-9])/)||[])[1] || 'p1';
var PHASE_META = { p1:{title:'PHASE 1',label:'Bulk'}, p2:{title:'PHASE 2',label:'Bulk'}, p3:{title:'PHASE 3',label:'Bulk'}, p4:{title:'PHASE 4',label:'Shred'}, p5:{title:'AD HOC',label:'Ad Hoc'} };
(function(){ var m=PHASE_META[PHASE]||{title:PHASE,label:''}; document.title=m.title+' Tracker'; var t=document.getElementById('planTitle'); if(t) t.textContent=m.title; var l=document.getElementById('planLabel'); if(l){ var dup=(''+m.label).toLowerCase()===(''+m.title).toLowerCase(); l.textContent=dup?'':m.label; l.style.display=dup?'none':''; } })();
var WT_ADHOC = /[?&]adhoc=/.test(location.search);
var WT_ADHOC_FOCUS = (location.search.match(/[?&]adhoc=([a-z0-9_-]+)/)||[])[1] || '';
var WT_UID = null, WT_NAME = '', CACHE_KEY = '', WT_ALL = {};
function wtEsc(s){ return String(s).replace(/[&<>]/g,function(c){ return c==='&'?'&amp;':(c==='<'?'&lt;':'&gt;'); }); }
const EQUIPMENT_OPTIONS = ['Barbell/Bench','Barbell/Rack','Bench','Cable','Floor','Free Weights','Machine','Other'];

function guessEquipment(name){
  const n = (name||'').toLowerCase();
  if(n.includes('cable')) return 'Cable';
  if(n.includes('machine')) return 'Machine';
  if(n.includes('dumbbell') || n.includes('kettlebell') || n.includes('plate') || n.includes('ez bar')) return 'Free Weights';
  if(n.includes('bench')) return 'Bench';
  if(n.includes('barbell') || n.includes('squat') || n.includes('deadlift') || n.includes('rack pull') || n.includes('military press') || n.includes('pendlay')) return 'Barbell/Rack';
  if(['sit up','plank','leg raise','mountain climber','flutter kick','push up','glute bridge'].some(k=>n.includes(k))) return 'Floor';
  if(['pull up','chin up','dip,','burpee','concentration curl'].some(k=>n.includes(k))) return 'Other';
  if(n.includes('bike') || n.includes('treadmill') || n.includes('elliptical')) return 'Machine';
  return 'Other';
}

const MUSCLE_LABELS = {
  cardio:'Cardio', legs:'Legs', chest:'Chest', back:'Back',
  shoulders:'Shoulders', arms:'Arms', core:'Core'
};
const MUSCLE_ALTS = MASTER_EXERCISE_DB;

const EXERCISE_IMAGES = {};
const SESSIONS = PHASES[PHASE] || PHASES.p1;

function findExtraWorkout(id){
  for(const d in data.extraWorkouts){
    const w = (data.extraWorkouts[d]||[]).find(x=>x.id===id);
    if(w) return w;
  }
  return null;
}

function getSessionObj(id){
  const fixed = SESSIONS.find(s=>s.id===id);
  if(fixed) return fixed;
  const w = findExtraWorkout(id);
  if(w) return {id:w.id, title:w.title, accent:w.accent, items:[]};
  return null;
}

function getExtrasForDate(dateStr){
  if(!data.extraWorkouts[dateStr]) data.extraWorkouts[dateStr] = [];
  return data.extraWorkouts[dateStr];
}

function allSessionsForDate(dateStr){
  const extras = getExtrasForDate(dateStr).map(w=> ({id:w.id, title:w.title, accent:w.accent, items:[]}));
  return [...SESSIONS, ...extras];
}

function sessionLeaves(s){
  let leaves=[];
  s.items.forEach(it=>{
    if(it.type==='single') leaves.push(it.ex);
    else leaves.push(...it.subs);
  });
  leaves.push(...getCustomList(s.id));
  return leaves;
}

function getCustomList(sessionId){
  if(!data.customExercises) data.customExercises = {};
  if(!data.customExercises[sessionId]) data.customExercises[sessionId] = [];
  return data.customExercises[sessionId];
}

let data = {progress:{}, swaps:{}, removed:{}, customExercises:{}, calorieUnit:'kcal', weightUnit:'lbs', extraWorkouts:{}, exerciseOrder:{}};
let currentSession = SESSIONS[0].id;
let userTouchedSession = false;
let WT_SESSION_FIXED = false;
(function(){ var sm=location.search.match(/[?&]session=(s\d+)/); if(sm && SESSIONS.some(function(s){return s.id===sm[1];})){ currentSession=sm[1]; WT_SESSION_FIXED=true; } })();
const todayStr = new Date().toISOString().slice(0,10);
let selectedDate = todayStr;
let weekOffset = 0;
(function(){
  try{
    var m = location.search.match(/[?&]date=(\d{4}-\d{2}-\d{2})/);
    if(m){
      selectedDate = m[1];
      var now=new Date(); var ts=new Date(now); ts.setHours(0,0,0,0); ts.setDate(now.getDate()-now.getDay());
      var t=new Date(selectedDate+'T00:00:00'); var tsun=new Date(t); tsun.setDate(t.getDate()-t.getDay());
      weekOffset = Math.round((tsun-ts)/604800000);
    }
  }catch(e){}
})();

function last7Days(){
  const days=[];
  const now = new Date();
  const sunday = new Date(now);
  sunday.setDate(now.getDate() - now.getDay() + weekOffset*7);
  for(let i=0;i<7;i++){
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

function wtApplyData(obj){
  data = obj || {};
  if(!data.progress) data.progress = {};
  if(!data.swaps) data.swaps = {};
  if(!data.removed) data.removed = {};
  if(!data.customExercises) data.customExercises = {};
  if(!data.calorieUnit) data.calorieUnit = 'kcal';
  if(!data.weightUnit) data.weightUnit = 'lbs';
  if(!data.extraWorkouts) data.extraWorkouts = {};
  if(!data.exerciseOrder) data.exerciseOrder = {};
}
// Pick the workout to open on: the next one in plan order given this week's progress.
function suggestedSessionForToday(){
  if(!SESSIONS.length) return currentSession;
  // Resume a session already started (but not finished) today.
  for(var i=0;i<SESSIONS.length;i++){ var c=sessionCompletionForDate(SESSIONS[i].id, todayStr); if(c>0 && c<0.999) return SESSIONS[i].id; }
  // Otherwise suggest the first workout in plan order not yet trained this week.
  var wk=last7Days();
  function trainedThisWeek(sid){ for(var j=0;j<wk.length;j++){ if(sessionCompletionForDate(sid, wk[j])>0) return true; } return false; }
  for(var k=0;k<SESSIONS.length;k++){ if(!trainedThisWeek(SESSIONS[k].id)) return SESSIONS[k].id; }
  return SESSIONS[0].id;
}
function applyDefaultSession(){
  if(WT_ADHOC || WT_SESSION_FIXED || userTouchedSession) return;
  if(selectedDate!==todayStr || weekOffset!==0) return;
  currentSession = suggestedSessionForToday();
}
async function loadData(){
  // Instant paint from local cache (or older local-profile data) so the plan always shows.
  var cached = null;
  try{ const raw = localStorage.getItem(CACHE_KEY); if(raw) cached = JSON.parse(raw); }catch(e){}
  if(!cached){ try{ const oa = localStorage.getItem('wt-active-user'); if(oa){ const r2 = localStorage.getItem('wt::'+oa+'::'+PHASE); if(r2) cached = JSON.parse(r2); } }catch(e){} }
  // Seed the cross-phase view from every phase's on-device cache (works without cloud).
  WT_ALL = {};
  ['p1','p2','p3','p4'].forEach(function(pk){ try{ var r=localStorage.getItem('wtcache::'+WT_UID+'::'+pk); if(r) WT_ALL[pk]=JSON.parse(r); }catch(e){} });
  wtApplyData(cached);
  WT_ALL[PHASE] = data;
  cleanupPhantomCalories();
  backfillMaxWeights();
  applyDefaultSession();
  render();
  requestAnimationFrame(focusFirstUnstarted);
  // Then sync from the cloud; merge cloud phases over the local caches.
  try{
    const all = await wtLoadAll(WT_UID);
    if(all) Object.keys(all).forEach(function(pk){ WT_ALL[pk] = all[pk]; });
    wtApplyData(WT_ALL[PHASE]);
    WT_ALL[PHASE] = data;
    cleanupPhantomCalories();
    backfillMaxWeights();
    applyDefaultSession();
    if(selectedDate!==todayStr && sessionCompletionForDate(currentSession, selectedDate)===0){ var _b=null,_c=0; SESSIONS.forEach(function(s){ var cc=sessionCompletionForDate(s.id,selectedDate); if(cc>_c){ _c=cc; _b=s.id; } }); if(_b) currentSession=_b; }
    render();
    if(WT_UID && (!all || !all[PHASE])) wtSavePhase(WT_UID, PHASE, data);
  }catch(e){}
}
async function saveData(){
  try{ if(CACHE_KEY) localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){}
  if(WT_UID) wtSavePhase(WT_UID, PHASE, data);
}

function blankSetEntry(ex){
  return ex.timed ? {duration:null} : {reps:null};
}
function getDateRecord(sessionId, dateStr){
  data.progress[sessionId] = data.progress[sessionId] || {};
  data.progress[sessionId][dateStr] = data.progress[sessionId][dateStr] || {};
  return data.progress[sessionId][dateStr];
}
function getExRecord(sessionId, dateStr, ex){
  const rec = getDateRecord(sessionId, dateStr);
  if(!rec[ex.id]){ rec[ex.id] = {sets:[], weight:null}; }
  const r = rec[ex.id];
  if(!Array.isArray(r.sets)) r.sets = [];
  while(r.sets.length < ex.sets){ r.sets.push(blankSetEntry(ex)); }
  r.sets = r.sets.map(entry=>{
    if(entry==null) return blankSetEntry(ex);
    if(typeof entry === 'boolean'){ return blankSetEntry(ex); }
    if(ex.timed && entry.done!==undefined && entry.duration===undefined){ return {duration: entry.done? ex.target : null}; }
    return entry;
  });
  if(r.weight===undefined) r.weight = null;
  if(!Array.isArray(r.removedSetIdx)) r.removedSetIdx = [];
  if(r.incline===undefined) r.incline = null;
  if(r.speed===undefined) r.speed = null;
  if(r.equipment===undefined) r.equipment = null;
  return r;
}

function prevWeightFor(sessionId, exId){
  const map = data.progress[sessionId] || {};
  const dates = Object.keys(map).filter(d=> d < selectedDate).sort().reverse();
  for(const d of dates){
    const rec = map[d][exId];
    if(rec && rec.weight!=null && rec.weight!==''){ return {weight:rec.weight, date:d}; }
  }
  return null;
}
// Best (highest) max weight ever logged for this exercise, before the selected date.
function bestMaxWeightFor(sessionId, exId){
  const map = data.progress[sessionId] || {};
  let best=null;
  Object.keys(map).filter(d=> d < selectedDate).forEach(d=>{
    const rec = map[d][exId];
    if(rec && rec.maxWeight!=null && rec.maxWeight!=='' && (best===null || Number(rec.maxWeight)>best.weight)){
      best = {weight:Number(rec.maxWeight), date:d};
    }
  });
  return best;
}

function prevCaloriesFor(sessionId){
  const map = data.progress[sessionId] || {};
  const dates = Object.keys(map).filter(d=> d < selectedDate).sort().reverse();
  for(const d of dates){
    const rec = map[d];
    if(rec && rec._calories!=null && rec._calories!==''){ return {calories:rec._calories, date:d}; }
  }
  return null;
}

function prevExFieldFor(sessionId, exId, field){
  const map = data.progress[sessionId] || {};
  const dates = Object.keys(map).filter(d=> d < selectedDate).sort().reverse();
  for(const d of dates){
    const rec = map[d][exId];
    if(rec && rec[field]!=null && rec[field]!==''){ return {value:rec[field], date:d}; }
  }
  return null;
}

function exFieldBadge(sessionId, ex, field, unit){
  const prev = prevExFieldFor(sessionId, ex.id, field);
  const rec = getExRecord(sessionId, selectedDate, ex);
  const cur = rec[field];
  if(cur==null || cur===''){
    return prev ? '<span style="font-size:10px;color:var(--text-faint);">last: '+prev.value+' '+unit+'</span>' : '<span style="font-size:10px;color:var(--text-faint);">&mdash;</span>';
  }
  if(!prev){
    return '<span style="font-size:10px;color:var(--text-faint);">first time</span>';
  }
  const diff = cur - prev.value;
  if(diff===0){
    return '<span style="font-size:10px;color:var(--text-faint);">same as last</span>';
  }
  const up = diff>0;
  return '<span style="font-size:10px;color:'+(up?'var(--up)':'var(--down)')+';display:inline-flex;align-items:center;gap:2px;"><i class="ti ti-arrow-'+(up?'up':'down')+'" style="font-size:11px;"></i>'+(up?'+':'')+diff+' '+unit+' vs last</span>';
}

function completionCount(rec, ex){
  let done=0;
  const removedIdx = new Set(rec.removedSetIdx||[]);
  rec.sets.slice(0, ex.sets).forEach((entry,i)=>{
    if(removedIdx.has(i)) return;
    if(ex.timed){ if(entry.duration!=null && entry.duration!=='' && entry.duration>0) done++; }
    else { if(entry.reps!=null && entry.reps!=='' && entry.reps>0) done++; }
  });
  return done;
}

function targetSetCount(rec, ex){
  const removedIdx = new Set(rec && rec.removedSetIdx || []);
  let n = 0;
  for(let i=0;i<ex.sets;i++){ if(!removedIdx.has(i)) n++; }
  return n;
}

function sessionCompletionForDate(sessionId, dateStr){
  const session = getSessionObj(sessionId);
  const prog = (data.progress[sessionId] && data.progress[sessionId][dateStr]) || {};
  let totalSets=0, doneSets=0;
  sessionLeaves(session).forEach(ex=>{
    if(data.removed[sessionId+'-'+ex.id]) return;
    const rec = prog[ex.id];
    totalSets += targetSetCount(rec, ex);
    if(rec) doneSets += completionCount(rec, ex);
  });
  return totalSets? doneSets/totalSets : 0;
}

/* ---- cross-phase training detection (a workout on a day counts across all phases) ---- */
function wtAnyLogged(rec){
  if(!rec || !rec.sets) return false;
  for(var i=0;i<rec.sets.length;i++){ var e=rec.sets[i]||{}; if((e.reps!=null&&e.reps!==''&&e.reps>0)||(e.duration!=null&&e.duration!==''&&e.duration>0)) return true; }
  return false;
}
function wtPhaseTrainedSessions(pdata, dateStr){
  var res=[]; if(!pdata||!pdata.progress) return res;
  var prog=pdata.progress;
  Object.keys(prog).forEach(function(sid){
    var rec = prog[sid] && prog[sid][dateStr]; if(!rec) return;
    var t=false; Object.keys(rec).forEach(function(exId){ if(exId.charAt(0)==='_') return; if(wtAnyLogged(rec[exId])) t=true; });
    if(t) res.push(sid);
  });
  return res;
}
function crossPhaseOtherDone(dateStr){
  var out=[]; if(typeof PHASES==='undefined') return out;
  Object.keys(WT_ALL).forEach(function(pk){
    if(pk===PHASE) return;
    var pdata=WT_ALL[pk]; if(!pdata) return;
    var defs=PHASES[pk]||[];
    wtPhaseTrainedSessions(pdata,dateStr).forEach(function(sid){
      for(var i=0;i<defs.length;i++){ if(defs[i].id===sid){ out.push({accent:defs[i].accent,title:defs[i].title,phase:pk}); break; } }
    });
  });
  return out;
}
function trainedOnDate(dateStr){
  if(allSessionsForDate(dateStr).some(function(s){ return sessionCompletionForDate(s.id,dateStr)>0; })) return true;
  return crossPhaseOtherDone(dateStr).length>0;
}
function allTrainedDates(){
  var set={};
  Object.keys(data.progress||{}).forEach(function(sid){ Object.keys(data.progress[sid]||{}).forEach(function(d){ set[d]=1; }); });
  Object.keys(WT_ALL).forEach(function(pk){ var pd=WT_ALL[pk]; if(!pd||!pd.progress) return; Object.keys(pd.progress).forEach(function(sid){ Object.keys(pd.progress[sid]||{}).forEach(function(d){ set[d]=1; }); }); });
  return Object.keys(set);
}

function weekSummary(){
  const days = last7Days();
  let anyComplete = 0;
  days.forEach(d=>{
    if(trainedOnDate(d)) anyComplete++;
  });
  return {days, anyComplete};
}

function trainingStats(){
  const allDates = allTrainedDates();
  let trained = 0;
  const trainedDates = [];
  allDates.forEach(d=>{
    if(trainedOnDate(d)){ trained++; trainedDates.push(d); }
  });
  let spanDays = 0, firstDate = null, lastDate = null;
  if(trainedDates.length){
    trainedDates.sort();
    firstDate = trainedDates[0];
    lastDate = trainedDates[trainedDates.length-1];
    const msPerDay = 24*60*60*1000;
    spanDays = Math.round((new Date(lastDate+'T00:00:00') - new Date(firstDate+'T00:00:00'))/msPerDay) + 1;
  }
  return { trained, spanDays, untrained: Math.max(0, spanDays-trained), firstDate, lastDate };
}

function weeklyCaloriesTotal(){
  const {days} = weekSummary();
  let total = 0;
  days.forEach(d=>{
    allSessionsForDate(d).forEach(s=>{
      const rec = data.progress[s.id] && data.progress[s.id][d];
      if(rec && rec._calories!=null && rec._calories!=='' && sessionCompletionForDate(s.id, d)>0){ total += Number(rec._calories); }
    });
  });
  return total;
}
// Remove calories that were auto-carried onto days where the workout wasn't actually trained.
function cleanupPhantomCalories(){
  var changed=false, prog=data.progress||{};
  Object.keys(prog).forEach(function(sid){
    if(!getSessionObj(sid)) return;
    var byDate=prog[sid]||{};
    Object.keys(byDate).forEach(function(d){
      var rec=byDate[d];
      if(rec && rec._calories!=null && rec._calories!=='' && sessionCompletionForDate(sid, d)===0){
        rec._calories=null; changed=true;
      }
    });
  });
  if(changed) saveData();
}
// Backfill: for every completed weighted exercise in history, set its max weight to the working+bar total if higher.
function backfillMaxWeights(){
  var changed=false, prog=data.progress||{};
  Object.keys(prog).forEach(function(sid){
    var so=getSessionObj(sid); if(!so) return;
    var leaves=sessionLeaves(so);
    var byDate=prog[sid]||{};
    Object.keys(byDate).forEach(function(d){
      var dayRec=byDate[d];
      leaves.forEach(function(ex){
        if(!ex.w) return;
        var rec=dayRec[ex.id];
        if(!rec || rec.weight==null || rec.weight==='' || !Array.isArray(rec.sets)) return;
        var target=targetSetCount(rec, ex);
        if(target>0 && completionCount(rec, ex)>=target){
          var total=Number(rec.weight) + ((rec.barWeight!=null && rec.barWeight!=='')?Number(rec.barWeight):0);
          if(rec.maxWeight==null || rec.maxWeight==='' || total>Number(rec.maxWeight)){
            rec.maxWeight=total; changed=true;
          }
        }
      });
    });
  });
  if(changed) saveData();
}

function renderWeekRing(){
  const {anyComplete} = weekSummary();
  const stats = trainingStats();
  const weekCal = weeklyCaloriesTotal();
  const unit = data.calorieUnit==='cal' ? 'Cal' : 'kCal';
  document.getElementById('weekRing').innerHTML =
    (WT_NAME ? '<a href="index.html?switch=1" title="Switch user" style="display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--text);font-size:13px;font-weight:600;line-height:1;background:var(--surface);border:0.5px solid var(--line);padding:5px 10px;border-radius:9px;margin-bottom:8px;">'+wtEsc(WT_NAME)+'<i class="ti ti-chevron-down" style="font-size:13px;color:var(--text-faint);"></i></a>' : '')+

function adhocWorkoutsFor(focus){
  var list = (typeof FOCUS_WORKOUTS!=='undefined' && FOCUS_WORKOUTS[focus]) ? FOCUS_WORKOUTS[focus] : [];
  var out=[];
  list.forEach(function(entry){
    var bar = entry.indexOf('|');
    if(bar<0) return;
    var ph = entry.slice(0,bar).replace(/\s+/g,'');
    var title = entry.slice(bar+1).replace(/^\s+|\s+$/g,'');
    var sessions = (typeof PHASES!=='undefined' && PHASES[ph]) ? PHASES[ph] : [];
    for(var i=0;i<sessions.length;i++){
      if(sessions[i].title===title){ out.push({phase:ph, session:sessions[i].id, title:title, accent:sessions[i].accent}); break; }
    }
  });
  return out;
}
function adhocPhaseTag(ph){
  var meta=(typeof PHASE_META!=='undefined' && PHASE_META[ph])?PHASE_META[ph]:null;
  if(!meta) return ph;
  return ph==='p5' ? meta.label : (meta.label+' '+ph.replace('p',''));
}

function adhocCenterHighlighted(){
  var center=function(row){
    if(!row) return;
    var el=row.querySelector('[data-on="1"]');
    if(!el) return;
    var target=el.offsetLeft - (row.clientWidth - el.offsetWidth)/2;
    row.scrollLeft = target>0 ? target : 0;
  };
  var run=function(){ center(document.getElementById('adhocChipRow')); center(document.getElementById('adhocWoRow')); };
  run();
  if(typeof requestAnimationFrame!=='undefined') requestAnimationFrame(run);
}

function caloriesBadge(dateRec){
  const unit = dateRec._calorieUnit==='cal' ? 'Cal' : 'kCal';
  const prev = prevCaloriesFor(currentSession);
  if(dateRec._calories==null || dateRec._calories===''){
    return prev ? '<span style="font-size:11px;color:var(--text-faint);">last: '+prev.calories+' '+unit+'</span>' : '<span style="font-size:11px;color:var(--text-faint);">first time logging</span>';
  }
  if(!prev){
    return '<span style="font-size:11px;color:var(--text-faint);">first time logging</span>';

  const diff = dateRec._calories - prev.calories;

  if(diff===0){

  const missingWeight = ex.w && (rec.weight==null || rec.weight==='');

  if(isFullyComplete && !missingWeight && !expandedOverrides.has(cardKey) && selectedDate===todayStr){

  let setsHtml='';
  rec.sets.forEach((entry,i)=>{

// Apply a saved custom order to a list of {key,...} blocks; unknown/new blocks keep natural order at the end.
function orderBlocks(sid, blocks){
  const ord = (data.exerciseOrder && data.exerciseOrder[sid]) || null;
  if(!ord || !ord.length) return blocks;
  const byKey = {}; blocks.forEach(b=> byKey[b.key]=b);
  const used = {}; const out=[];
  ord.forEach(k=>{ if(byKey[k] && !used[k]){ out.push(byKey[k]); used[k]=1; } });
  blocks.forEach(b=>{ if(!used[b.key]) out.push(b); });
  return out;
}
// The reorderable blocks of a session (singles, supersets, standalone customs) with display labels, in current order.
function sessionBlockList(sid){
  const s = getSessionObj(sid); if(!s) return [];
  const customList = getCustomList(sid).filter(ex=> !data.removed[sid+'-'+ex.id]);
  const pairedMap = {}; const standaloneCustoms=[];
  customList.forEach(ex=>{ if(ex.pairedWith){ (pairedMap[ex.pairedWith]=pairedMap[ex.pairedWith]||[]).push(ex);} else standaloneCustoms.push(ex); });
  const nameOf = ex => (data.swaps[sid+'-'+ex.id]||ex.name);
  const blocks=[];
  s.items.forEach((item, ii)=>{
    if(item.type==='single'){
      if(data.removed[sid+'-'+item.ex.id]) return;
      const pairs = pairedMap[item.ex.id]||[];
      blocks.push({key:'i:'+item.ex.id, label: pairs.length? (nameOf(item.ex)+' + '+pairs.map(nameOf).join(' + ')) : nameOf(item.ex)});
    } else {
      const visibleSubs = item.subs.filter(sub=> !data.removed[sid+'-'+sub.id]);
      if(!visibleSubs.length) return;
      const allSubs=[]; visibleSubs.forEach(sub=>{ allSubs.push(sub); (pairedMap[sub.id]||[]).forEach(p=>allSubs.push(p)); });
      blocks.push({key:'g:'+(item.id||('idx'+ii)), label:'Superset: '+allSubs.map(nameOf).join(' + ')});
    }
  });
  standaloneCustoms.forEach(ex=>{
    const pairs=pairedMap[ex.id]||[];
    blocks.push({key:'c:'+ex.id, label: pairs.length? (nameOf(ex)+' + '+pairs.map(nameOf).join(' + ')) : nameOf(ex)});
  });
  return orderBlocks(sid, blocks);
}
function openReorder(sid){
  const existing=document.getElementById('reorderOverlay'); if(existing) existing.remove();
  const overlay=document.createElement('div');
  overlay.id='reorderOverlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.82);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
  const title = (getSessionObj(sid)||{}).title || '';
  function draw(){
    const list = sessionBlockList(sid);
    overlay.innerHTML = '<div style="max-width:460px;width:100%;max-height:85vh;overflow:auto;background:var(--surface);border-radius:14px;padding:14px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'+
        '<div style="font-size:15px;font-weight:700;">Reorder exercises</div>'+
        '<button id="reorderDone" style="background:var(--surface-hi);border:0.5px solid var(--line);color:var(--text);font-size:12px;padding:6px 14px;border-radius:8px;font-weight:600;">Done</button>'+
      '</div>'+
      '<div style="font-size:11px;color:var(--text-faint);margin-bottom:12px;">'+wtEsc(title.toUpperCase())+'</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px;">'+
        list.map((b,i)=>
          '<div style="display:flex;align-items:center;gap:8px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:10px;padding:8px 10px;">'+
            '<span style="width:18px;flex:0 0 auto;font-size:12px;color:var(--text-faint);">'+(i+1)+'</span>'+
            '<span style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+wtEsc(b.label)+'</span>'+
            '<button data-mv="up" data-key="'+wtEsc(b.key)+'" '+(i===0?'disabled':'')+' style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);width:32px;height:32px;border-radius:8px;flex:0 0 auto;'+(i===0?'opacity:0.3;':'')+'"><i class="ti ti-chevron-up" style="font-size:15px;"></i></button>'+
            '<button data-mv="down" data-key="'+wtEsc(b.key)+'" '+(i===list.length-1?'disabled':'')+' style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);width:32px;height:32px;border-radius:8px;flex:0 0 auto;'+(i===list.length-1?'opacity:0.3;':'')+'"><i class="ti ti-chevron-down" style="font-size:15px;"></i></button>'+
          '</div>'
        ).join('')+
      '</div>';
    document.getElementById('reorderDone').onclick=()=>{ overlay.remove(); render(); };
    overlay.querySelectorAll('[data-mv]').forEach(btn=>{
      btn.onclick=async ()=>{
        const keys = sessionBlockList(sid).map(x=>x.key);
        const idx = keys.indexOf(btn.dataset.key);
        const j = idx + (btn.dataset.mv==='up'? -1 : 1);
        if(idx<0 || j<0 || j>=keys.length) return;
        const tmp=keys[idx]; keys[idx]=keys[j]; keys[j]=tmp;
        if(!data.exerciseOrder) data.exerciseOrder={};
        data.exerciseOrder[sid]=keys;
        await saveData();
        draw();
      };
    });
  }
  draw();
  document.body.appendChild(overlay);
  overlay.onclick=(e)=>{ if(e.target===overlay){ overlay.remove(); render(); } };
}

function renderExercises(){
  const s = getSessionObj(currentSession);
  let carriedAny = false;
  if(selectedDate === todayStr){
    sessionLeaves(s).forEach(ex=>{
      const rec = getExRecord(s.id, selectedDate, ex);
      if(ex.w && (rec.weight==null || rec.weight==='')){
        const prev = prevWeightFor(s.id, ex.id);
        if(prev){ rec.weight = prev.weight; carriedAny = true; }
      }
      if(ex.w && (rec.maxWeight==null || rec.maxWeight==='')){
        const bestMax = bestMaxWeightFor(s.id, ex.id);
        if(bestMax){ rec.maxWeight = bestMax.weight; carriedAny = true; }
      }
      if(ex.w && (rec.barWeight==null || rec.barWeight==='')){
        const prevBar = prevExFieldFor(s.id, ex.id, 'barWeight');
        if(prevBar){ rec.barWeight = prevBar.value; carriedAny = true; }
      }
      // Once a weighted exercise is completed, capture its working+bar total as the max if it's a new high.
      if(ex.w && rec.weight!=null && rec.weight!==''){
        const exDone = targetSetCount(rec, ex) > 0 && completionCount(rec, ex) >= targetSetCount(rec, ex);
        if(exDone){
          const total = Number(rec.weight) + ((rec.barWeight!=null && rec.barWeight!=='') ? Number(rec.barWeight) : 0);
          if(rec.maxWeight==null || rec.maxWeight==='' || total > Number(rec.maxWeight)){
            rec.maxWeight = total; carriedAny = true;
          }
        }
      }
      if(ex.cardio){
        if(rec.incline==null || rec.incline===''){
          const prevInc = prevExFieldFor(s.id, ex.id, 'incline');
          if(prevInc){ rec.incline = prevInc.value; carriedAny = true; }
        }
        if(rec.speed==null || rec.speed===''){
          const prevSpd = prevExFieldFor(s.id, ex.id, 'speed');
          if(prevSpd){ rec.speed = prevSpd.value; carriedAny = true; }
        }
      }
      if(!rec.equipment){
        const prevEquip = prevExFieldFor(s.id, ex.id, 'equipment');
        if(prevEquip){ rec.equipment = prevEquip.value; carriedAny = true; }
      }
    });
    if(carriedAny) saveData();
  }

  const customList = getCustomList(s.id).filter(ex=> !data.removed[s.id+'-'+ex.id]);
  const pairedMap = {};
  const standaloneCustoms = [];
  customList.forEach(ex=>{
    if(ex.pairedWith){ (pairedMap[ex.pairedWith] = pairedMap[ex.pairedWith]||[]).push(ex); }
    else { standaloneCustoms.push(ex); }
  });

  function supersetWrapperHTML(subs, roundsLabel){
    const muscles = [...new Set(subs.map(x=>x.muscle))];
    const dots = muscles.map(m=>'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--'+m+');"></span>').join('');
    let subHtml = subs.map(sub=> leafCardHTML(s.id, sub, 'var(--surface-hi)')).join('');
    return '<div style="background:var(--surface);border-radius:12px;padding:10px;border:1px dashed var(--line);">'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:0 2px;">'+
        '<i class="ti ti-repeat" style="font-size:13px;color:var(--text-dim);"></i>'+
        '<span style="font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;">Superset'+(roundsLabel? ' &middot; '+roundsLabel+' rounds' : '')+'</span>'+
        '<span style="margin-left:auto;display:flex;gap:4px;">'+dots+'</span>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:8px;">'+subHtml+'</div>'+
    '</div>';
  }

  const blocks=[];
  s.items.forEach((item, ii)=>{
    if(item.type==='single'){
      if(data.removed[s.id+'-'+item.ex.id]) return;
      const pairs = pairedMap[item.ex.id]||[];
      const h = pairs.length===0 ? leafCardHTML(s.id, item.ex, 'var(--surface)') : supersetWrapperHTML([item.ex, ...pairs], item.ex.sets);
      blocks.push({key:'i:'+item.ex.id, html:h});
    } else {
      const visibleSubs = item.subs.filter(sub=> !data.removed[s.id+'-'+sub.id]);
      if(visibleSubs.length===0) return;
      const allSubs = [];
      visibleSubs.forEach(sub=>{ allSubs.push(sub); (pairedMap[sub.id]||[]).forEach(p=> allSubs.push(p)); });
      const muscles = [...new Set(allSubs.map(x=>x.muscle))];
      const dots = muscles.map(m=>'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--'+m+');"></span>').join('');
      let subHtml='';
      allSubs.forEach(sub=>{ subHtml += leafCardHTML(s.id, sub, 'var(--surface-hi)'); });
      const h = '<div style="background:var(--surface);border-radius:12px;padding:10px;border:1px dashed var(--line);">'+
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:0 2px;">'+
          '<i class="ti ti-repeat" style="font-size:13px;color:var(--text-dim);"></i>'+
          '<span style="font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;">Superset &middot; '+item.rounds+' rounds</span>'+
          '<span style="margin-left:auto;display:flex;gap:4px;">'+dots+'</span>'+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:8px;">'+subHtml+'</div>'+
      '</div>';
      blocks.push({key:'g:'+(item.id||('idx'+ii)), html:h});
    }
  });
  standaloneCustoms.forEach(ex=>{
    const pairs = pairedMap[ex.id]||[];
    const h = pairs.length===0 ? leafCardHTML(s.id, ex, 'var(--surface)') : supersetWrapperHTML([ex, ...pairs], ex.sets);
    blocks.push({key:'c:'+ex.id, html:h});
  });

  let html = orderBlocks(s.id, blocks).map(b=>b.html).join('');

  html += '<button id="addExerciseBtn" style="background:transparent;border:1.5px dashed var(--line);color:var(--text-dim);font-size:13px;padding:12px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;"><i class="ti ti-plus" style="font-size:15px;"></i>Add exercise</button>';

  const removedInSession = sessionLeaves(s).filter(ex=> data.removed[s.id+'-'+ex.id]);
  if(removedInSession.length){
    html += '<div style="background:var(--surface);border-radius:12px;padding:10px;border:0.5px dashed var(--line);">'+
      '<div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">Removed from this session</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px;">'+
      removedInSession.map(ex=>
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">'+
          '<span style="font-size:12px;color:var(--text-dim);">'+((data.swaps[s.id+'-'+ex.id])||ex.name)+'</span>'+
          '<button data-unremove="'+s.id+'-'+ex.id+'" style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);font-size:11px;padding:4px 8px;border-radius:8px;">Restore</button>'+
        '</div>'
      ).join('')+
      '</div>'+
    '</div>';
  }
  document.getElementById('exerciseList').innerHTML = html;

  document.querySelectorAll('[data-unremove]').forEach(b=>{
    b.onclick = async ()=>{
      delete data.removed[b.dataset.unremove];
      await saveData(); render();
    };
  });
  document.getElementById('addExerciseBtn').onclick = ()=> openAddExerciseForm(s.id);
  document.querySelectorAll('[data-addpair]').forEach(btn=>{
    btn.onclick = ()=>{
      const [sid, exId] = btn.dataset.addpair.split('|||');
      openAddExerciseForm(sid, exId);
    };
  });

  document.querySelectorAll('[data-duration]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.duration, idx = parseInt(inp.dataset.idx);
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      const val = inp.value==='' ? null : parseFloat(inp.value);
      rec.sets[idx].duration = val;
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-timer]').forEach(btn=>{
    btn.onclick = ()=>{
      const exId=btn.dataset.timer, idx=parseInt(btn.dataset.timeridx);
      if(plankTimer && plankTimer.exId===exId && plankTimer.idx===idx) stopPlankTimer();
      else startPlankTimer(exId, idx);
    };
  });
  if(plankTimer) renderTimerBtn();
  document.querySelectorAll('[data-reps]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.reps, idx = parseInt(inp.dataset.idx);
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      const val = inp.value==='' ? null : parseInt(inp.value);
      rec.sets[idx].reps = val;
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-weight]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.weight;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      const val = inp.value==='' ? null : parseFloat(inp.value);
      rec.weight = val;
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-maxweight]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.maxweight;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      const val = inp.value==='' ? null : parseFloat(inp.value);
      rec.maxWeight = val;
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-barweight]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.barweight;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      const val = inp.value==='' ? null : parseFloat(inp.value);
      rec.barWeight = val;
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-wunit]').forEach(btn=>{
    btn.onclick = async ()=>{
      data.weightUnit = btn.dataset.wunit;
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-equipment]').forEach(sel=>{
    sel.onchange = async ()=>{
      const exId = sel.dataset.equipment;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.equipment = sel.value || null;
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-incline]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.incline;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.incline = inp.value==='' ? null : parseFloat(inp.value);
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-speed]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.speed;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.speed = inp.value==='' ? null : parseFloat(inp.value);
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-addset]').forEach(btn=>{
    btn.onclick = async ()=>{
      const exId = btn.dataset.addset;
      const ex = sessionLeaves(s).find(x=>x.id===exId);
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.sets.push(blankSetEntry(ex));
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = async ()=>{
      const exId = btn.dataset.remove, idx = parseInt(btn.dataset.idx);
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.sets.splice(idx,1);
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-toggleset]').forEach(btn=>{
    btn.onclick = async ()=>{
      const exId = btn.dataset.toggleset, idx = parseInt(btn.dataset.idx);
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      if(!rec.removedSetIdx) rec.removedSetIdx = [];
      const pos = rec.removedSetIdx.indexOf(idx);
      if(pos>=0) rec.removedSetIdx.splice(pos,1); else rec.removedSetIdx.push(idx);
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-forcecomplete]').forEach(btn=>{
    btn.onclick = async ()=>{
      const exId = btn.dataset.forcecomplete;
      const s = getSessionObj(currentSession);
      const ex = sessionLeaves(s).find(e=>e.id===exId);
      if(!ex) return;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      if(!rec.removedSetIdx) rec.removedSetIdx = [];
      const alreadyComplete = targetSetCount(rec, ex) > 0 && completionCount(rec, ex) >= targetSetCount(rec, ex);
      if(alreadyComplete){
        rec.sets.forEach((entry,i)=>{
          if(rec.removedSetIdx.includes(i)) return;
          if(ex.timed){ entry.duration = null; } else { entry.reps = null; }
        });
      } else {
        let targetVal;
        if(ex.timed){
          targetVal = ex.target;
        } else {
          const nums = (ex.reps.match(/\d+/g)||['10']).map(Number);
          targetVal = nums[nums.length-1];
        }
        rec.sets.forEach((entry,i)=>{
          if(rec.removedSetIdx.includes(i)) return;
          if(ex.timed){ if(entry.duration==null || entry.duration==='') entry.duration = targetVal; }
          else { if(entry.reps==null || entry.reps==='') entry.reps = targetVal; }
        });
      }
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-clearex]').forEach(btn=>{
    btn.onclick = async ()=>{
      const exId = btn.dataset.clearex;
      const s = getSessionObj(currentSession);
      const ex = sessionLeaves(s).find(e=>e.id===exId);
      if(!ex) return;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      if(rec && Array.isArray(rec.sets)){
        rec.sets = rec.sets.slice(0, ex.sets).map(()=> blankSetEntry(ex));
      }
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-expandcard]').forEach(btn=>{
    btn.onclick = ()=>{
      expandedOverrides.add(btn.dataset.expandcard);
      render();
    };
  });
  document.querySelectorAll('[data-collapsecard]').forEach(btn=>{
    btn.onclick = ()=>{
      expandedOverrides.delete(btn.dataset.collapsecard);
      render();
    };
  });
  document.querySelectorAll('[data-swap]').forEach(btn=>{
    btn.onclick = ()=> openSwapMenu(btn.dataset.swap, btn.dataset.muscle, btn.dataset.orig);
  });
  document.querySelectorAll('[data-reorder]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openReorder(el.dataset.reorder); };
  });
  document.querySelectorAll('[data-skipex]').forEach(b=>{
    b.onclick = async ()=>{ data.removed[b.dataset.skipex] = true; await saveData(); render(); };
  });
  document.querySelectorAll('[data-photo]').forEach(btn=>{
    btn.onclick = ()=> openPhoto(btn.dataset.photo);
  });
  document.querySelectorAll('[data-note]').forEach(ta=>{
    ta.onchange = async ()=>{
      const exId = ta.dataset.note;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.userNote = ta.value;
      await saveData();
    };
  });
}

        '<textarea id="addNotes" rows="2" placeholder="Form cues, equipment, anything to remember" style="width:100%;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;padding:6px 8px;resize:vertical;font-family:'+"'"+'Inter'+"'"+',system-ui,sans-serif;"></textarea>'+
      '</div>'+
      '<button id="addExSubmit" style="background:var(--legs);color:#121316;border:none;font-weight:600;font-size:14px;padding:10px;border-radius:10px;margin-top:4px;">'+(removeKey? 'Replace exercise' : 'Add to this session')+'</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  document.getElementById('addExClose').onclick = ()=> overlay.remove();

  document.getElementById('addDbPick').onchange = (e)=>{
    const v = e.target.value;
    if(!v) return;
    const [m,name] = v.split('|||');
    document.getElementById('addName').value = name;
    document.getElementById('addMuscle').value = m;
    document.getElementById('addWeight').checked = !(m==='cardio' || ['Floor','Other'].indexOf(guessEquipment(name))>=0);
  };
  document.getElementById('addTimed').onchange = (e)=>{
    document.getElementById('addRepsWrap').style.display = e.target.checked ? 'none' : 'block';
    document.getElementById('addDurationWrap').style.display = e.target.checked ? 'block' : 'none';
    document.getElementById('addWeight').checked = !e.target.checked;
  };

  document.getElementById('addExSubmit').onclick = async ()=>{
    const name = document.getElementById('addName').value.trim();
    if(!name){ document.getElementById('addName').style.borderColor = 'var(--down)'; return; }
    const muscle = document.getElementById('addMuscle').value;
    const sets = Math.max(1, parseInt(document.getElementById('addSets').value)||1);
    const timed = document.getElementById('addTimed').checked;
    const trackWeight = document.getElementById('addWeight').checked;
    const notes = document.getElementById('addNotes').value.trim();
    const ex = { id: 'c'+Date.now(), name, muscle, sets, w: trackWeight };
    if(timed){
      ex.timed = true;
      ex.target = Math.max(1, parseFloat(document.getElementById('addDuration').value)||10);
      ex.unit = document.getElementById('addUnit').value;
    } else {
      ex.reps = document.getElementById('addReps').value.trim() || '10';
    }
    if(notes) ex.note = notes;
    if(pairedWith) ex.pairedWith = pairedWith;
    getCustomList(sessionId).push(ex);
    if(removeKey) data.removed[removeKey] = true;
    await saveData();
    overlay.remove();
    render();
  };
}

let openSwapKey = null;
function getAllActiveExerciseNames(){
  const names = new Set();
  SESSIONS.forEach(s=>{
    sessionLeaves(s).forEach(ex=>{
      if(data.removed[s.id+'-'+ex.id]) return;
      names.add((data.swaps[s.id+'-'+ex.id]) || ex.name);
    });
  });
  return names;
}

function openSwapMenu(key, muscle, orig){
  const existing = document.getElementById('swapMenu');
  if(existing) existing.remove();
  if(openSwapKey===key){ openSwapKey=null; return; }
  openSwapKey = key;
  const opts = (MUSCLE_ALTS[muscle]||[]).filter(o=>o!==orig);
  const activeNames = getAllActiveExerciseNames();
  const available = opts.filter(o=> !activeNames.has(o)).sort((a,b)=> a.localeCompare(b));
  const inPlan = opts.filter(o=> activeNames.has(o)).sort((a,b)=> a.localeCompare(b));
  let html = '<div id="swapMenu" style="position:relative;background:var(--surface-hi);border-radius:10px;padding:10px;margin-top:-4px;margin-bottom:10px;border:0.5px solid var(--line);">'+
    '<div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">Swap for an alternative '+MUSCLE_LABELS[muscle]+' exercise</div>'+
    '<div style="display:flex;flex-direction:column;gap:6px;">'+
    '<button data-restore="'+key+'" style="text-align:left;background:transparent;border:0.5px solid var(--line);color:var(--text);font-size:13px;padding:7px 10px;border-radius:8px;">'+orig+' (original)</button>';
  available.forEach(o=>{
    html += '<button data-choose="'+key+'" data-name="'+o+'" style="text-align:left;background:transparent;border:0.5px solid var(--line);color:var(--text);font-size:13px;padding:7px 10px;border-radius:8px;">'+o+'</button>';
  });
  if(inPlan.length){
    html += '<div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;margin-top:6px;margin-bottom:2px;">Already in your plan</div>';
    inPlan.forEach(o=>{
      html += '<button data-choose="'+key+'" data-name="'+o+'" style="text-align:left;background:transparent;border:0.5px solid var(--line);color:var(--text-dim);font-size:13px;padding:7px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;">'+
        '<span>'+o+'</span><span style="font-size:9px;color:var(--text-faint);border:0.5px solid var(--line);padding:2px 6px;border-radius:6px;">in plan</span>'+
      '</button>';
    });
  }
  html += '<button data-customswap="'+key+'" style="text-align:left;background:transparent;border:0.5px dashed var(--line);color:var(--text-dim);font-size:13px;padding:7px 10px;border-radius:8px;margin-top:2px;display:flex;align-items:center;gap:6px;"><i class="ti ti-plus" style="font-size:14px;"></i>Fill in a custom exercise</button>'+
    '<button data-remove-ex="'+key+'" style="text-align:left;background:transparent;border:0.5px solid var(--down);color:var(--down);font-size:13px;padding:7px 10px;border-radius:8px;margin-top:2px;display:flex;align-items:center;gap:6px;"><i class="ti ti-trash" style="font-size:14px;"></i>Remove this exercise from my plan</button>';
  html += '</div></div>';
  const btn = document.querySelector('[data-swap="'+key+'"]');
  const card = btn.closest('div[style*="border-left"]');
  card.insertAdjacentHTML('afterend', html);
  document.querySelectorAll('[data-choose]').forEach(b=>{
    b.onclick = async ()=>{
      data.swaps[b.dataset.choose] = b.dataset.name;
      openSwapKey=null;
      await saveData(); render();
    };
  });
  document.querySelectorAll('[data-restore]').forEach(b=>{
    b.onclick = async ()=>{
      delete data.swaps[b.dataset.restore];
      openSwapKey=null;
      await saveData(); render();
    };
  });
  document.querySelectorAll('[data-remove-ex]').forEach(b=>{
    b.onclick = async ()=>{
      data.removed[b.dataset.removeEx] = true;
      openSwapKey=null;
      await saveData(); render();
    };
  });
  document.querySelectorAll('[data-customswap]').forEach(b=>{
    b.onclick = ()=>{
      const swapKey = b.dataset.customswap;
      const dashIdx = swapKey.indexOf('-');
      const sid = swapKey.slice(0, dashIdx);
      openSwapKey = null;
      const menu = document.getElementById('swapMenu');
      if(menu) menu.remove();
      openAddExerciseForm(sid, null, swapKey);
    };
  });
}

function firstFocusExId(){
  const s=getSessionObj(currentSession); if(!s) return null;
  const leaves=sessionLeaves(s).filter(ex=> !data.removed[s.id+'-'+ex.id]);
  if(!leaves.length) return null;
  const info=leaves.map(ex=>{
    const rec=getExRecord(s.id, selectedDate, ex);
    return {ex, done:completionCount(rec, ex), target:targetSetCount(rec, ex)};
  });
  let lastStarted=-1;
  info.forEach((it,i)=>{ if(it.done>0) lastStarted=i; });
  // next un-started AFTER your latest progress
  for(let i=Math.max(0,lastStarted+1); i<info.length; i++){ if(info[i].done===0) return info[i].ex.id; }
  // otherwise any un-started you skipped earlier
  for(let i=0;i<info.length;i++){ if(info[i].done===0) return info[i].ex.id; }
  // otherwise the first partially-done one
  for(let i=0;i<info.length;i++){ if(info[i].target>0 && info[i].done<info[i].target) return info[i].ex.id; }
  return null;
}
function focusFirstUnstarted(){
  const s=getSessionObj(currentSession); if(!s) return;
  const leaves=sessionLeaves(s).filter(ex=> !data.removed[s.id+'-'+ex.id]);
  const exId=firstFocusExId();
  if(!exId || (leaves.length && exId===leaves[0].id)){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  let sel;
  try{ sel='#exerciseList [data-reps="'+CSS.escape(exId)+'"], #exerciseList [data-duration="'+CSS.escape(exId)+'"]'; }
  catch(e){ sel='#exerciseList [data-reps="'+exId+'"], #exerciseList [data-duration="'+exId+'"]'; }
  const el=document.querySelector(sel);
  if(!el){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  const card=el.closest('#exerciseList > div') || el;
  const header=document.getElementById('sessionHeader');
  const offset=(header? header.getBoundingClientRect().height : 0) + 14;
  const y=card.getBoundingClientRect().top + window.pageYOffset - offset;
  window.scrollTo({top: Math.max(0, y), behavior:'smooth'});
}

var plankTimer = null;
function fmtTimer(sec){ var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
function renderTimerBtn(){
  if(!plankTimer) return;
  var el = document.querySelector('[data-timer="'+plankTimer.exId+'"][data-timeridx="'+plankTimer.idx+'"]');
  if(el){
    var sec = Math.floor((Date.now()-plankTimer.startMs)/1000);
    el.innerHTML = '<i class="ti ti-player-stop-filled" style="font-size:13px;"></i>Timer Stop &middot; '+fmtTimer(sec);
    el.style.background='var(--down)'; el.style.color='#121316'; el.style.borderColor='var(--down)';
  }
}
function startPlankTimer(exId, idx){
  if(plankTimer){ clearInterval(plankTimer.interval); plankTimer=null; }
  plankTimer = { exId:exId, idx:idx, startMs:Date.now(), interval:null };
  plankTimer.interval = setInterval(renderTimerBtn, 250);
  renderTimerBtn();
}
async function stopPlankTimer(){
  if(!plankTimer) return;
  clearInterval(plankTimer.interval);
  var t = plankTimer; plankTimer = null;
  var sec = Math.round((Date.now()-t.startMs)/1000);
  var rec = getDateRecord(currentSession, selectedDate)[t.exId];
  if(rec && rec.sets && rec.sets[t.idx]){ rec.sets[t.idx].duration = sec; await saveData(); }
  render();
}
function render(){
  const isFixed = SESSIONS.some(s=>s.id===currentSession);
  const isExtraForThisDate = getExtrasForDate(selectedDate).some(w=>w.id===currentSession);
  if(!isFixed && !isExtraForThisDate){ currentSession = SESSIONS[0].id; }
  renderWeekRing();
  renderWeekStrip();
  renderDayTabs();
  renderSessionHeader();
  renderCalories();
  renderSessionNote();
  renderExercises();
}

document.addEventListener('focusin', (e)=>{
  const t = e.target;
  if(t.tagName!=='INPUT' || t.type!=='number') return;
  const isDur = t.dataset.duration!=null;
  const exId = t.dataset.reps!=null ? t.dataset.reps : (isDur ? t.dataset.duration : null);
  if(exId!=null && (t.value==='' || t.value==null)){
    const s = getSessionObj(currentSession);
    const ex = s ? sessionLeaves(s).find(x=>x.id===exId) : null;
    if(ex){
      let targetVal;
      if(isDur){ targetVal = ex.target; }
      else { const nums=(String(ex.reps).match(/\d+/g)||['10']).map(Number); targetVal = nums[nums.length-1]; }
      if(targetVal!=null && targetVal!==''){
        t.value = targetVal;
        const idx = parseInt(t.dataset.idx);
        const rec = getDateRecord(currentSession, selectedDate)[exId];
        if(rec && Array.isArray(rec.sets) && rec.sets[idx]){
          if(isDur) rec.sets[idx].duration = targetVal; else rec.sets[idx].reps = targetVal;
          saveData();
        }
        const color = 'var(--'+ex.muscle+')';
        t.style.background = color; t.style.color = '#121316';
      }
    }
  } else if(t.dataset.weight!=null && (t.value==='' || t.value==null)){
    const prev = prevWeightFor(currentSession, t.dataset.weight);
    if(prev && prev.weight!=null && prev.weight!==''){
      t.value = prev.weight;
      const rec = getDateRecord(currentSession, selectedDate)[t.dataset.weight];
      if(rec){ rec.weight = prev.weight; saveData(); }
    }
  }
});
// Single click/tap just fills & completes the set; double-click selects all to edit
document.addEventListener('dblclick', (e)=>{
  const t = e.target;
  if(t.tagName==='INPUT' && t.type==='number') t.select();
});

wtAuth.onAuthStateChanged(function(user){
  if(!user){ location.replace('index.html'); return; }
  WT_UID = user.uid;
  WT_NAME = user.displayName || (user.email ? user.email.split('@')[0] : 'Me');
  CACHE_KEY = 'wtcache::' + WT_UID + '::' + PHASE;
  loadData();
});
