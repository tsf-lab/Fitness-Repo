    <a href="index.html" style="display:inline-flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;flex:0 0 auto;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:0 1px 2px rgba(0,0,0,0.25);">
      <i class="ti ti-layout-grid" style="font-size:22px;color:var(--text-dim);"></i>
      <span style="font-family:'Bebas Neue',system-ui,sans-serif;font-size:24px;line-height:0.82;letter-spacing:0.02em;">Workout<br>Hub</span>
      <i class="ti ti-chevron-right" style="font-size:15px;color:var(--text-faint);"></i>
    </a>
    <div id="weekRing" style="text-align:right;"></div>
  </div>

  <div id="weekStrip" style="display:flex;gap:6px;margin-bottom:16px;"></div>

  <div id="dayTabs" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-ms-overflow-style:none;scrollbar-width:none;"></div>

  <div style="margin-bottom:8px;">
    <div id="planLabel" style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.12em;">Bulk</div>
    <h1 id="planTitle" style="font-size:28px;margin:0;line-height:1;">PHASE 2</h1>
  </div>

  <div id="sessionHeader" style="position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 12px;margin-bottom:2px;"></div>

  <textarea id="sessionNote" rows="1" placeholder="Add a note for today's session (energy, soreness, gym conditions...)" style="width:100%;background:var(--surface);border:0.5px solid var(--line);border-radius:10px;color:var(--text);font-size:12px;padding:8px 10px;margin-bottom:12px;resize:vertical;min-height:34px;font-family:'Inter',system-ui,sans-serif;"></textarea>

  <div id="exerciseList" style="display:flex;flex-direction:column;gap:10px;"></div>

  <div style="margin-top:18px;padding-top:14px;border-top:0.5px solid var(--line);">
    <div style="font-size:12px;color:var(--text-faint);">Log actual reps and weight per set. Weight carries forward until updated.</div>
  </div>
</div>

<script>
/* ---- Firebase-backed session (per-account cloud data) ---- */
var PHASE = (location.search.match(/[?&]phase=(p[1-9])/)||[])[1] || 'p1';
var PHASE_META = { p1:{title:'PHASE 1',label:'Bulk'}, p2:{title:'PHASE 2',label:'Bulk'}, p3:{title:'PHASE 3',label:'Bulk'}, p4:{title:'PHASE 4',label:'Shred'}, p5:{title:'AD HOC',label:'Ad Hoc'} };
(function(){ var m=PHASE_META[PHASE]||{title:PHASE,label:''}; document.title=m.title+' Tracker'; var t=document.getElementById('planTitle'); if(t) t.textContent=m.title; var l=document.getElementById('planLabel'); if(l){ var dup=(''+m.label).toLowerCase()===(''+m.title).toLowerCase(); l.textContent=dup?'':m.label; l.style.display=dup?'none':''; } })();
var WT_ADHOC = /[?&]adhoc=/.test(location.search);
var WT_ADHOC_FOCUS = (location.search.match(/[?&]adhoc=([a-z0-9_-]+)/)||[])[1] || '';
var WT_UID = null, WT_NAME = '', CACHE_KEY = '', WT_ALL = {};
function wtEsc(s){ return String(s).replace(/[&<>]/g,function(c){ return c==='&'?'&amp;':(c==='<'?'&lt;':'&gt;'); }); }
// Each exercise picks equipment from one of three kinds:
//  - strength: weighted lifts (positive weight)
//  - cardio:   cardio machines (incline/speed/duration)
//  - loadbw:   loadable bodyweight (dips/pull-ups): a bar with signed added
//              weight (+ added belt / - assisted band) OR a weight machine
const STRENGTH_EQUIP_OPTIONS = ['Dumbbells','Kettlebell','Cable','Machine','Plate-loaded','Barbell','Bodyweight'];
const CARDIO_EQUIP_OPTIONS   = ['Treadmill','Bike','Elliptical','Rower','Stair Climber','Other'];
const LOADBW_EQUIP_OPTIONS   = ['Pull-up Bar','Machine'];
function isCardioEx(ex){ return !!(ex && (ex.cardio || ex.muscle==='cardio')); }
// Dips / pull-ups / chin-ups: bodyweight moves that can be loaded or assisted.
function isLoadableBW(ex, displayName){
  const n = (displayName || (ex && ex.name) || '').toLowerCase();
  return n.indexOf('dip')>-1 || n.indexOf('pull up')>-1 || n.indexOf('pull-up')>-1 ||
         n.indexOf('pullup')>-1 || n.indexOf('chin up')>-1 || n.indexOf('chin-up')>-1;
}
function equipKind(ex){ return isLoadableBW(ex) ? 'loadbw' : (isCardioEx(ex) ? 'cardio' : 'strength'); }
function optionsForKind(kind){ return kind==='cardio'?CARDIO_EQUIP_OPTIONS : (kind==='loadbw'?LOADBW_EQUIP_OPTIONS : STRENGTH_EQUIP_OPTIONS); }
function equipOptionsFor(ex){ return optionsForKind(equipKind(ex)); }
// The Demo / Photo buttons search the web for the *selected* equipment plus the
// exercise name, so "Chest Press" set to Cable finds cable demos, not machine ones.
// [search term to prepend, regex matching names that already imply it]. An empty
// term means the equipment adds nothing useful to a query (Pull-up Bar / Other).
const EQUIP_SEARCH = {
  'Dumbbells':     ['dumbbell',        /dumbbell|\bdbs?\b/],
  'Kettlebell':    ['kettlebell',      /kettlebell|\bkbs?\b/],
  'Cable':         ['cable',           /cable/],
  'Machine':       ['machine',         /machine/],
  'Plate-loaded':  ['plate loaded',    /plate.?load/],
  'Barbell':       ['barbell',         /barbell|\bbb\b/],
  'Bodyweight':    ['bodyweight',      /body ?weight/],
  'Pull-up Bar':   ['',                null],
  'Treadmill':     ['treadmill',       /treadmill|walk|run/],
  'Bike':          ['stationary bike', /bike|cycl|spin/],
  'Elliptical':    ['elliptical',      /elliptical/],
  'Rower':         ['rowing machine',  /row/],
  'Stair Climber': ['stair climber',   /stair|climb|step/],
  'Other':         ['',                null]
};
function searchSubject(displayName, equip){
  const e = EQUIP_SEARCH[equip];
  if(!e || !e[0]) return displayName;
  // Drop the prefix when the name already says it ("DB Bench Press" on Dumbbells).
  return e[1].test((displayName||'').toLowerCase()) ? displayName : e[0]+' '+displayName;
}
// A loadable-bodyweight exercise shows weight fields even though ex.w is false.
function exIsWeighted(ex){ return !!(ex && ex.w) || isLoadableBW(ex); }
// On the bar, weight is signed (+ added / - assisted); the Machine behaves like a normal lift.
function isSignedWeight(ex, equip){ return isLoadableBW(ex) && equip==='Pull-up Bar'; }
// Collapse any legacy/plan label into the curated strength toggle set.
function normStrength(label){
  const n = (label==null?'':String(label)).trim().toLowerCase();
  if(!n) return 'Bodyweight';
  if(n.indexOf('cable')>-1) return 'Cable';
  if(n.indexOf('plate')>-1) return 'Plate-loaded';
  if(n.indexOf('kettle')>-1) return 'Kettlebell';
  if(n.indexOf('machine')>-1) return 'Machine';
  if(n.indexOf('barbell')>-1 || n.indexOf('bench')>-1 || n.indexOf('rack')>-1) return 'Barbell';
  if(n.indexOf('free weight')>-1 || n.indexOf('dumbbell')>-1) return 'Dumbbells';
  if(n.indexOf('floor')>-1 || n.indexOf('other')>-1 || n.indexOf('body')>-1) return 'Bodyweight';
  return 'Bodyweight';
}
// Collapse a cardio machine name/label into the curated cardio toggle set.
function normCardio(label){
  const n = (label==null?'':String(label)).trim().toLowerCase();
  if(n.indexOf('tread')>-1 || n.indexOf('walk')>-1 || n.indexOf('run')>-1) return 'Treadmill';
  if(n.indexOf('bike')>-1 || n.indexOf('cycl')>-1 || n.indexOf('spin')>-1) return 'Bike';
  if(n.indexOf('elliptical')>-1) return 'Elliptical';
  if(n.indexOf('row')>-1) return 'Rower';
  if(n.indexOf('stair')>-1 || n.indexOf('step')>-1 || n.indexOf('climb')>-1) return 'Stair Climber';
  return 'Other';
}
// Collapse a loadable-bodyweight label into its toggle set (Pull-up Bar / Machine).
function normLoadBW(label){
  const n = (label==null?'':String(label)).trim().toLowerCase();
  return n.indexOf('machine')>-1 ? 'Machine' : 'Pull-up Bar';
}
function normFor(label, kind){
  if(kind==='cardio') return normCardio(label);
  if(kind==='loadbw') return normLoadBW(label);
  return normStrength(label);
}
// Default equipment for an exercise before anything has been chosen.
function defEquipFor(ex, displayName){
  const nm = displayName || (ex && ex.name);
  const kind = equipKind(ex);
  if(kind==='cardio') return normCardio(nm);
  if(kind==='loadbw') return 'Pull-up Bar';
  return normStrength((ex && ex.equip) || guessEquipment(nm));
}
// Currently active equipment for a record (falls back to the default).
function activeEquipFor(rec, ex, displayName){
  const kind = equipKind(ex);
  const stored = rec && rec.equipment;
  if(stored){
    const ns = normFor(stored, kind);
    if(optionsForKind(kind).indexOf(ns) > -1) return ns;
  }
  return defEquipFor(ex, displayName);
}
// Per-equipment logged fields. The ACTIVE equipment's values live flat on the
// exercise record; other equipments' values are stashed under record._alt[equip].
const BUCKET_FIELDS = ['sets','weight','maxWeight','barWeight','userNote','removedSetIdx','incline','speed'];
function extractBucket(c){ const b={}; BUCKET_FIELDS.forEach(f=>{ b[f]=c[f]; }); return b; }
function applyBucket(c, b){
  if(b){
    c.sets = Array.isArray(b.sets)? b.sets : [];
    c.weight = b.weight===undefined?null:b.weight;
    c.maxWeight = b.maxWeight===undefined?null:b.maxWeight;
    c.barWeight = b.barWeight===undefined?null:b.barWeight;
    c.userNote = b.userNote===undefined?'':b.userNote;
    c.removedSetIdx = Array.isArray(b.removedSetIdx)? b.removedSetIdx : [];
    c.incline = b.incline===undefined?null:b.incline;
    c.speed = b.speed===undefined?null:b.speed;
  } else {
    c.sets=[]; c.weight=null; c.maxWeight=null; c.barWeight=null; c.userNote=''; c.removedSetIdx=[]; c.incline=null; c.speed=null;
  }
}
// Swap the active equipment on a record, stashing the current values and
// restoring the target equipment's stashed values (or blanks for a fresh one).
function switchEquipInPlace(container, oldEquip, newEquipRaw, kind){
  const newEquip = normFor(newEquipRaw, kind);
  oldEquip = normFor(oldEquip, kind);
  container.equipment = newEquip;
  if(newEquip===oldEquip) return;
  container._alt = container._alt || {};
  // Find the target equipment's stashed bucket, normalizing legacy keys (e.g. a
  // record stashed under 'Free Weights' still matches the renamed 'Dumbbells').
  let restored = null;
  for(const k in container._alt){ if(normFor(k, kind)===newEquip){ restored = container._alt[k]; delete container._alt[k]; break; } }
  container._alt[oldEquip] = extractBucket(container);
  applyBucket(container, restored);
}
// Resolve the equipment bucket for a given date/equipment. The active bucket is
// the flat record itself; inactive buckets live under _alt. defEquip is used for
// legacy records that predate equipment selection (no stored equipment label).
function bucketAt(sessionId, d, exId, equip, defEquip, kind){
  const map = data.progress[sessionId] || {};
  const c = map[d] && map[d][exId];
  if(!c) return null;
  let act = c.equipment ? normFor(c.equipment, kind) : defEquip;
  if(optionsForKind(kind).indexOf(act) < 0) act = defEquip;
  if(act===equip) return c;
  if(c._alt){
    if(c._alt[equip]) return c._alt[equip];
    for(const k in c._alt){ if(normFor(k, kind)===equip) return c._alt[k]; }
  }
  return null;
}

// Fallback strength-equipment guess from an exercise name (returns canonical
// labels). Only used when an exercise has no explicit equip; cardio and
// loadable-bodyweight defaults are handled by defEquipFor, not here.
function guessEquipment(name){
  const n = (name||'').toLowerCase();
  if(n.includes('cable')) return 'Cable';
  if(n.includes('plate')) return 'Plate-loaded';
  if(n.includes('kettlebell')) return 'Kettlebell';
  if(n.includes('machine')) return 'Machine';
  if(n.includes('dumbbell') || n.includes('ez bar')) return 'Dumbbells';
  if(n.includes('bench') || n.includes('barbell') || n.includes('squat') || n.includes('deadlift') || n.includes('rack pull') || n.includes('military press') || n.includes('pendlay')) return 'Barbell';
  return 'Bodyweight';
}

const MUSCLE_LABELS = {
  cardio:'Cardio', legs:'Legs', chest:'Chest', back:'Back',
  shoulders:'Shoulders', arms:'Arms', core:'Core'
};
const MUSCLE_ALTS = MASTER_EXERCISE_DB;

const EXERCISE_IMAGES = {};
const SESSIONS = PHASES[PHASE] || PHASES.p1;

function findExtraWorkout(id){
  for(const d in data.extraWorkouts){
    const w = (data.extraWorkouts[d]||[]).find(x=>x.id===id);
    if(w) return w;
  }
  return null;
}

function getSessionObj(id){
  const fixed = SESSIONS.find(s=>s.id===id);
  if(fixed) return fixed;
  const w = findExtraWorkout(id);
  if(w) return {id:w.id, title:w.title, accent:w.accent, items:[]};
  return null;
}

function getExtrasForDate(dateStr){
  if(!data.extraWorkouts[dateStr]) data.extraWorkouts[dateStr] = [];
  return data.extraWorkouts[dateStr];
}

function allSessionsForDate(dateStr){
  const extras = getExtrasForDate(dateStr).map(w=> ({id:w.id, title:w.title, accent:w.accent, items:[]}));
  return [...SESSIONS, ...extras];
}

function sessionLeaves(s, dateStr){
  let leaves=[];
  s.items.forEach(it=>{
    if(it.type==='single') leaves.push(it.ex);
    else leaves.push(...it.subs);
  });
  leaves.push(...getCustomList(s.id, dateStr));
  return leaves;
}

/* ---- day-scoped plan edits ----------------------------------------------
   Swapping, skipping or adding an exercise changes only the day it was done
   on. The plan definition stays pristine, so opening the same workout on a
   later day starts from the original exercise list again.
   Readers never create storage (the week strip queries dozens of dates);
   the edit* helpers do.                                                   */
function swapsFor(dateStr){ return (data.swapsByDate && data.swapsByDate[dateStr||selectedDate]) || {}; }
function removedFor(dateStr){ return (data.removedByDate && data.removedByDate[dateStr||selectedDate]) || {}; }
function getCustomList(sessionId, dateStr){
  const byDate = data.customByDate && data.customByDate[dateStr||selectedDate];
  return (byDate && byDate[sessionId]) || [];
}
function editSwaps(dateStr){
  const d = dateStr||selectedDate;
  if(!data.swapsByDate) data.swapsByDate = {};
  if(!data.swapsByDate[d]) data.swapsByDate[d] = {};
  return data.swapsByDate[d];
}
function editRemoved(dateStr){
  const d = dateStr||selectedDate;
  if(!data.removedByDate) data.removedByDate = {};
  if(!data.removedByDate[d]) data.removedByDate[d] = {};
  return data.removedByDate[d];
}
function editCustomList(sessionId, dateStr){
  const d = dateStr||selectedDate;
  if(!data.customByDate) data.customByDate = {};
  if(!data.customByDate[d]) data.customByDate[d] = {};
  if(!data.customByDate[d][sessionId]) data.customByDate[d][sessionId] = [];
  return data.customByDate[d][sessionId];
}
// The name to show for an exercise on a given day (its swap, else the plan's).
function swapName(sessionId, ex, dateStr){ return swapsFor(dateStr)[sessionId+'-'+ex.id] || ex.name; }
function isRemoved(sessionId, exId, dateStr){ return !!removedFor(dateStr)[sessionId+'-'+exId]; }

let data = {progress:{}, swapsByDate:{}, removedByDate:{}, customByDate:{}, calorieUnit:'kcal', weightUnit:'lbs', extraWorkouts:{}, exerciseOrder:{}};
let currentSession = SESSIONS[0].id;
let userTouchedSession = false;
let WT_SESSION_FIXED = false;
(function(){ var sm=location.search.match(/[?&]session=(s\d+)/); if(sm && SESSIONS.some(function(s){return s.id===sm[1];})){ currentSession=sm[1]; WT_SESSION_FIXED=true; } })();
const todayStr = new Date().toISOString().slice(0,10);
let selectedDate = todayStr;
let weekOffset = 0;
(function(){
  try{
    var m = location.search.match(/[?&]date=(\d{4}-\d{2}-\d{2})/);
    if(m){
      selectedDate = m[1];
      var now=new Date(); var ts=new Date(now); ts.setHours(0,0,0,0); ts.setDate(now.getDate()-now.getDay());
      var t=new Date(selectedDate+'T00:00:00'); var tsun=new Date(t); tsun.setDate(t.getDate()-t.getDay());
      weekOffset = Math.round((tsun-ts)/604800000);
    }
  }catch(e){}
})();

function last7Days(){
  const days=[];
  const now = new Date();
  const sunday = new Date(now);
  sunday.setDate(now.getDate() - now.getDay() + weekOffset*7);
  for(let i=0;i<7;i++){
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

function wtApplyData(obj){
  data = obj || {};
  if(!data.progress) data.progress = {};
  if(!data.swapsByDate) data.swapsByDate = {};
  if(!data.removedByDate) data.removedByDate = {};
  if(!data.customByDate) data.customByDate = {};
  if(!data.calorieUnit) data.calorieUnit = 'kcal';
  if(!data.weightUnit) data.weightUnit = 'lbs';
  if(!data.extraWorkouts) data.extraWorkouts = {};
  if(!data.exerciseOrder) data.exerciseOrder = {};
  migrateDayScopedEdits();
}
// Swaps / skips / added exercises used to be stored plan-wide, which meant an
// edit made on one day silently rewrote every other day. Move any such saved
// edit onto the days it was actually in effect -- every day that session was
// logged, plus today so nothing disappears mid-plan -- and let future days fall
// back to the original plan.
function migrateDayScopedEdits(){
  const oldSwaps = data.swaps, oldRemoved = data.removed, oldCustom = data.customExercises;
  if(!oldSwaps && !oldRemoved && !oldCustom) return;
  const datesFor = sid=>{
    const set = {};
    Object.keys((data.progress && data.progress[sid]) || {}).forEach(d=> set[d]=1);
    set[todayStr] = 1;
    return Object.keys(set);
  };
  const sidOf = key=> key.slice(0, key.indexOf('-'));
  Object.keys(oldSwaps||{}).forEach(key=>{
    datesFor(sidOf(key)).forEach(d=>{ const m = editSwaps(d); if(m[key]===undefined) m[key] = oldSwaps[key]; });
  });
  Object.keys(oldRemoved||{}).forEach(key=>{
    datesFor(sidOf(key)).forEach(d=>{ const m = editRemoved(d); if(m[key]===undefined) m[key] = oldRemoved[key]; });
  });
  Object.keys(oldCustom||{}).forEach(sid=>{
    (oldCustom[sid]||[]).forEach(ex=>{
      datesFor(sid).forEach(d=>{
        // Only onto days that actually logged it (plus today), so an exercise
        // added months ago doesn't appear across the whole history.
        const dayProg = data.progress[sid] && data.progress[sid][d];
        if(d!==todayStr && !(dayProg && dayProg[ex.id])) return;
        const list = editCustomList(sid, d);
        if(!list.some(x=> x.id===ex.id)) list.push(ex);
      });
    });
  });
  // Keep the pre-migration copy under a key nothing reads, so this is
  // reversible by hand if anything looks wrong. Removing the originals is what
  // stops the migration re-running (and re-adding an edit you just undid).
  data._legacyPlanEdits = {swaps: oldSwaps||null, removed: oldRemoved||null, customExercises: oldCustom||null};
  delete data.swaps; delete data.removed; delete data.customExercises;
}
// Pick the workout to open on: the next one in plan order given this week's progress.
function suggestedSessionForToday(){
  if(!SESSIONS.length) return currentSession;
  // Resume a session already started (but not finished) today.
  for(var i=0;i<SESSIONS.length;i++){ var c=sessionCompletionForDate(SESSIONS[i].id, todayStr); if(c>0 && c<0.999) return SESSIONS[i].id; }
  // Otherwise suggest the first workout in plan order not yet trained this week.
  var wk=last7Days();
  function trainedThisWeek(sid){ for(var j=0;j<wk.length;j++){ if(sessionCompletionForDate(sid, wk[j])>0) return true; } return false; }
  for(var k=0;k<SESSIONS.length;k++){ if(!trainedThisWeek(SESSIONS[k].id)) return SESSIONS[k].id; }
  return SESSIONS[0].id;
}
function applyDefaultSession(){
  if(WT_ADHOC || WT_SESSION_FIXED || userTouchedSession) return;
  if(selectedDate!==todayStr || weekOffset!==0) return;
  currentSession = suggestedSessionForToday();
}
async function loadData(){
  // Instant paint from local cache (or older local-profile data) so the plan always shows.
  var cached = null;
  try{ const raw = localStorage.getItem(CACHE_KEY); if(raw) cached = JSON.parse(raw); }catch(e){}
  if(!cached){ try{ const oa = localStorage.getItem('wt-active-user'); if(oa){ const r2 = localStorage.getItem('wt::'+oa+'::'+PHASE); if(r2) cached = JSON.parse(r2); } }catch(e){} }
  // Seed the cross-phase view from every phase's on-device cache (works without cloud).
  WT_ALL = {};
  ['p1','p2','p3','p4'].forEach(function(pk){ try{ var r=localStorage.getItem('wtcache::'+WT_UID+'::'+pk); if(r) WT_ALL[pk]=JSON.parse(r); }catch(e){} });
  wtApplyData(cached);
  WT_ALL[PHASE] = data;
  applyDefaultSession();
  render();                                  // instant first paint from cache
  requestAnimationFrame(focusFirstUnstarted);
  // Then sync from the cloud; merge cloud phases over the local caches.
  var all = null, cloudOk = false;
  try{ all = await wtLoadAll(WT_UID); cloudOk = true; }catch(e){}
  if(all){ Object.keys(all).forEach(function(pk){ WT_ALL[pk] = all[pk]; }); wtApplyData(WT_ALL[PHASE]); WT_ALL[PHASE] = data; }
  // Normalize once, on the authoritative data (post-cloud, or cache if offline).
  cleanupPhantomCalories();
  backfillMaxWeights();
  applyDefaultSession();
  if(selectedDate!==todayStr && sessionCompletionForDate(currentSession, selectedDate)===0){ var _b=null,_c=0; SESSIONS.forEach(function(s){ var cc=sessionCompletionForDate(s.id,selectedDate); if(cc>_c){ _c=cc; _b=s.id; } }); if(_b) currentSession=_b; }
  render();
  if(cloudOk && WT_UID && (!all || !all[PHASE])) wtSavePhase(WT_UID, PHASE, data);
}
// Local cache write is debounced (coalesces rapid set-logging into one
// JSON.stringify of the whole history) and flushed on page hide so nothing is
// lost. Cloud save is already debounced inside wtSavePhase.
var _lsSaveTimer = null;
function flushLocalSave(){
  if(_lsSaveTimer){ clearTimeout(_lsSaveTimer); _lsSaveTimer = null; }
  try{ if(CACHE_KEY) localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){}
}
async function saveData(){
  if(_lsSaveTimer) clearTimeout(_lsSaveTimer);
  _lsSaveTimer = setTimeout(flushLocalSave, 400);
  if(WT_UID) wtSavePhase(WT_UID, PHASE, data);
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') flushLocalSave(); });
window.addEventListener('pagehide', flushLocalSave);

function blankSetEntry(ex){
  return ex.timed ? {duration:null} : {reps:null};
}
function getDateRecord(sessionId, dateStr){
  data.progress[sessionId] = data.progress[sessionId] || {};
  data.progress[sessionId][dateStr] = data.progress[sessionId][dateStr] || {};
  return data.progress[sessionId][dateStr];
}
function getExRecord(sessionId, dateStr, ex){
  const rec = getDateRecord(sessionId, dateStr);
  if(!rec[ex.id]){ rec[ex.id] = {sets:[], weight:null}; }
  const r = rec[ex.id];
  if(!Array.isArray(r.sets)) r.sets = [];
  while(r.sets.length < ex.sets){ r.sets.push(blankSetEntry(ex)); }
  r.sets = r.sets.map(entry=>{
    if(entry==null) return blankSetEntry(ex);
    if(typeof entry === 'boolean'){ return blankSetEntry(ex); }
    if(ex.timed && entry.done!==undefined && entry.duration===undefined){ return {duration: entry.done? ex.target : null}; }
    return entry;
  });
  if(r.weight===undefined) r.weight = null;
  if(!Array.isArray(r.removedSetIdx)) r.removedSetIdx = [];
  if(r.incline===undefined) r.incline = null;
  if(r.speed===undefined) r.speed = null;
  if(r.equipment===undefined) r.equipment = null;
  return r;
}

// All cross-date lookups below are scoped to a single equipment so that, e.g.,
// Cable weights never carry to Machine. Pass the currently active equip plus the
// exercise's default equip (for legacy records with no stored equipment label).
function prevWeightFor(sessionId, exId, equip, defEquip, kind){
  const map = data.progress[sessionId] || {};
  const dates = Object.keys(map).filter(d=> d < selectedDate).sort().reverse();
  for(const d of dates){
    const b = bucketAt(sessionId, d, exId, equip, defEquip, kind);
    if(b && b.weight!=null && b.weight!==''){ return {weight:b.weight, date:d}; }
  }
  return null;
}
// Best (highest) max weight ever logged for this exercise+equipment, before the selected date.
function bestMaxWeightFor(sessionId, exId, equip, defEquip, kind){
  const map = data.progress[sessionId] || {};
  let best=null;
  Object.keys(map).filter(d=> d < selectedDate).forEach(d=>{
    const b = bucketAt(sessionId, d, exId, equip, defEquip, kind);
    if(b && b.maxWeight!=null && b.maxWeight!=='' && (best===null || Number(b.maxWeight)>best.weight)){
      best = {weight:Number(b.maxWeight), date:d};
    }
  });
  return best;
}
// Previous value of a bucketed field (barWeight/incline/speed), scoped to equipment.
function prevBucketFieldFor(sessionId, exId, field, equip, defEquip, kind){
  const map = data.progress[sessionId] || {};
  const dates = Object.keys(map).filter(d=> d < selectedDate).sort().reverse();
  for(const d of dates){
    const b = bucketAt(sessionId, d, exId, equip, defEquip, kind);
    if(b && b[field]!=null && b[field]!==''){ return {value:b[field], date:d}; }
  }
  return null;
}

function prevCaloriesFor(sessionId){
  const map = data.progress[sessionId] || {};
  const dates = Object.keys(map).filter(d=> d < selectedDate).sort().reverse();
  for(const d of dates){
    const rec = map[d];
    if(rec && rec._calories!=null && rec._calories!==''){ return {calories:rec._calories, date:d}; }
  }
  return null;
}

function prevExFieldFor(sessionId, exId, field){
  const map = data.progress[sessionId] || {};
  const dates = Object.keys(map).filter(d=> d < selectedDate).sort().reverse();
  for(const d of dates){
    const rec = map[d][exId];
    if(rec && rec[field]!=null && rec[field]!==''){ return {value:rec[field], date:d}; }
  }
  return null;
}

function completionCount(rec, ex){
  let done=0;
  const removedIdx = new Set(rec.removedSetIdx||[]);
  rec.sets.slice(0, ex.sets).forEach((entry,i)=>{
    if(removedIdx.has(i)) return;
    if(ex.timed){ if(entry.duration!=null && entry.duration!=='' && entry.duration>0) done++; }
    else { if(entry.reps!=null && entry.reps!=='' && entry.reps>0) done++; }
  });
  return done;
}

function targetSetCount(rec, ex){
  const removedIdx = new Set(rec && rec.removedSetIdx || []);
  let n = 0;
  for(let i=0;i<ex.sets;i++){ if(!removedIdx.has(i)) n++; }
  return n;
}

function sessionCompletionForDate(sessionId, dateStr){
  const session = getSessionObj(sessionId);
  const prog = (data.progress[sessionId] && data.progress[sessionId][dateStr]) || {};
  let totalSets=0, doneSets=0;
  sessionLeaves(session, dateStr).forEach(ex=>{
    if(isRemoved(sessionId, ex.id, dateStr)) return;
    const rec = prog[ex.id];
    totalSets += targetSetCount(rec, ex);
    if(rec) doneSets += completionCount(rec, ex);
  });
  return totalSets? doneSets/totalSets : 0;
}

/* ---- cross-phase training detection (a workout on a day counts across all phases) ---- */
function wtAnyLogged(rec){
  if(!rec || !rec.sets) return false;
  for(var i=0;i<rec.sets.length;i++){ var e=rec.sets[i]||{}; if((e.reps!=null&&e.reps!==''&&e.reps>0)||(e.duration!=null&&e.duration!==''&&e.duration>0)) return true; }
  return false;
}
function wtPhaseTrainedSessions(pdata, dateStr){
  var res=[]; if(!pdata||!pdata.progress) return res;
  var prog=pdata.progress;
  Object.keys(prog).forEach(function(sid){
    var rec = prog[sid] && prog[sid][dateStr]; if(!rec) return;
    var t=false; Object.keys(rec).forEach(function(exId){ if(exId.charAt(0)==='_') return; if(wtAnyLogged(rec[exId])) t=true; });
    if(t) res.push(sid);
  });
  return res;
}
function crossPhaseOtherDone(dateStr){
  var out=[]; if(typeof PHASES==='undefined') return out;
  Object.keys(WT_ALL).forEach(function(pk){
    if(pk===PHASE) return;
    var pdata=WT_ALL[pk]; if(!pdata) return;
    var defs=PHASES[pk]||[];
    wtPhaseTrainedSessions(pdata,dateStr).forEach(function(sid){
      for(var i=0;i<defs.length;i++){ if(defs[i].id===sid){ out.push({accent:defs[i].accent,title:defs[i].title,phase:pk}); break; } }
    });
  });
  return out;
}
function trainedOnDate(dateStr){
  if(allSessionsForDate(dateStr).some(function(s){ return sessionCompletionForDate(s.id,dateStr)>0; })) return true;
  return crossPhaseOtherDone(dateStr).length>0;
}
function allTrainedDates(){
  var set={};
  Object.keys(data.progress||{}).forEach(function(sid){ Object.keys(data.progress[sid]||{}).forEach(function(d){ set[d]=1; }); });
  Object.keys(WT_ALL).forEach(function(pk){ var pd=WT_ALL[pk]; if(!pd||!pd.progress) return; Object.keys(pd.progress).forEach(function(sid){ Object.keys(pd.progress[sid]||{}).forEach(function(d){ set[d]=1; }); }); });
  return Object.keys(set);
}

function weekSummary(){
  const days = last7Days();
  let anyComplete = 0;
  days.forEach(d=>{
    if(trainedOnDate(d)) anyComplete++;
  });
  return {days, anyComplete};
}

function trainingStats(){
  const allDates = allTrainedDates();
  let trained = 0;
  const trainedDates = [];
  allDates.forEach(d=>{
    if(trainedOnDate(d)){ trained++; trainedDates.push(d); }
  });
  let spanDays = 0, firstDate = null, lastDate = null;
  if(trainedDates.length){
    trainedDates.sort();
    firstDate = trainedDates[0];
    lastDate = trainedDates[trainedDates.length-1];
    const msPerDay = 24*60*60*1000;
    spanDays = Math.round((new Date(lastDate+'T00:00:00') - new Date(firstDate+'T00:00:00'))/msPerDay) + 1;
  }
  return { trained, spanDays, untrained: Math.max(0, spanDays-trained), firstDate, lastDate };
}

function weeklyCaloriesTotal(){
  const {days} = weekSummary();
  let total = 0;
  days.forEach(d=>{
    allSessionsForDate(d).forEach(s=>{
      const rec = data.progress[s.id] && data.progress[s.id][d];
      if(rec && rec._calories!=null && rec._calories!=='' && sessionCompletionForDate(s.id, d)>0){ total += Number(rec._calories); }
    });
  });
  return total;
}
// Remove calories that were auto-carried onto days where the workout wasn't actually trained.
function cleanupPhantomCalories(){
  var changed=false, prog=data.progress||{};
  Object.keys(prog).forEach(function(sid){
    if(!getSessionObj(sid)) return;
    var byDate=prog[sid]||{};
    Object.keys(byDate).forEach(function(d){
      var rec=byDate[d];
      if(rec && rec._calories!=null && rec._calories!=='' && sessionCompletionForDate(sid, d)===0){
        rec._calories=null; changed=true;
      }
    });
  });
  if(changed) saveData();
}
// Backfill: for every completed weighted exercise in history, set its max weight to the working+bar total if higher.
function backfillMaxWeights(){
  var changed=false, prog=data.progress||{};
  Object.keys(prog).forEach(function(sid){
    var so=getSessionObj(sid); if(!so) return;
    var byDate=prog[sid]||{};
    Object.keys(byDate).forEach(function(d){
      var dayRec=byDate[d];
      var leaves=sessionLeaves(so, d);   // that day's list: customs are day-scoped
      leaves.forEach(function(ex){
        if(!exIsWeighted(ex)) return;
        var rec=dayRec[ex.id];
        if(!rec) return;
        // Process the active bucket plus any stashed per-equipment buckets.
        var buckets=[rec];
        if(rec._alt){ Object.keys(rec._alt).forEach(function(eq){ buckets.push(rec._alt[eq]); }); }
        buckets.forEach(function(b){
          if(!b || b.weight==null || b.weight==='' || !Array.isArray(b.sets)) return;
          var target=targetSetCount(b, ex);
          if(target>0 && completionCount(b, ex)>=target){
            var total=Number(b.weight) + ((b.barWeight!=null && b.barWeight!=='')?Number(b.barWeight):0);
            if(b.maxWeight==null || b.maxWeight==='' || total>Number(b.maxWeight)){
              b.maxWeight=total; changed=true;
            }
          }
        });
      });
    });
  });
  if(changed) saveData();
}

  'Legs':'Legs', 'Chest and triceps':'Chest', 'Back and abs':'Back',
  'Shoulders and biceps':'Shldrs', 'Full upper':'Upper'
};
function shortLabel(title){
  if(SHORT_LABELS[title]) return SHORT_LABELS[title];
  return title.length>7 ? title.slice(0,6)+'…' : title;
}

function fmtWeekRange(a,b){
  var o={month:'short',day:'numeric'};
  return new Date(a+'T00:00:00').toLocaleDateString('en-US',o)+' – '+new Date(b+'T00:00:00').toLocaleDateString('en-US',o);
}

      '<button id="weekNext" '+(weekOffset>=0?'disabled ':'')+'style="'+navBtn+(weekOffset>=0?'opacity:0.35;':'')+'">Next<i class="ti ti-chevron-right"></i></button>'+

    btn.onclick = ()=>{
      var d = btn.dataset.pickday;

function adhocWorkoutsFor(focus){
  var list = (typeof FOCUS_WORKOUTS!=='undefined' && FOCUS_WORKOUTS[focus]) ? FOCUS_WORKOUTS[focus] : [];
  var out=[];
  list.forEach(function(entry){
    var bar = entry.indexOf('|');
    if(bar<0) return;
    var ph = entry.slice(0,bar).replace(/\s+/g,'');
    var title = entry.slice(bar+1).replace(/^\s+|\s+$/g,'');
    var sessions = (typeof PHASES!=='undefined' && PHASES[ph]) ? PHASES[ph] : [];
    for(var i=0;i<sessions.length;i++){
      if(sessions[i].title===title){ out.push({phase:ph, session:sessions[i].id, title:title, accent:sessions[i].accent}); break; }
    }
  });
  return out;
}
function adhocPhaseTag(ph){
  var meta=(typeof PHASE_META!=='undefined' && PHASE_META[ph])?PHASE_META[ph]:null;
  if(!meta) return ph;
  return ph==='p5' ? meta.label : (meta.label+' '+ph.replace('p',''));
}

function adhocCenterHighlighted(){
  var center=function(row){
    if(!row) return;
    var el=row.querySelector('[data-on="1"]');
    if(!el) return;
    var target=el.offsetLeft - (row.clientWidth - el.offsetWidth)/2;
    row.scrollLeft = target>0 ? target : 0;
  };
  var run=function(){ center(document.getElementById('adhocChipRow')); center(document.getElementById('adhocWoRow')); };
  run();
  if(typeof requestAnimationFrame!=='undefined') requestAnimationFrame(run);
}

  const isToday = selectedDate===todayStr;

  document.getElementById('sessionHeader').innerHTML =
    (!isToday ? '<div style="display:flex;align-items:center;gap:8px;background:var(--surface-hi);border-radius:8px;padding:6px 10px;margin-bottom:8px;">'+
      '<i class="ti ti-history" style="font-size:14px;color:var(--text-dim);"></i>'+
      '<span style="font-size:11px;color:var(--text-dim);flex:1;">Viewing '+dateLabel+'</span>'+
      '<button id="jumpToday" style="background:transparent;border:0.5px solid var(--line);color:var(--text);font-size:11px;padding:3px 8px;border-radius:7px;">Back to today</button>'+
    '</div>' : '')+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">'+
      '<h2 style="font-size:22px;margin:0;color:var(--'+s.accent+');">'+s.title.toUpperCase()+'</h2>'+
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto;">'+
        '<div style="font-size:12px;color:var(--text-dim);">'+comp+'% '+dateLabel+'</div>'+
        '<button id="resetBtn" style="background:transparent;border:0.5px solid var(--line);color:var(--text-faint);font-size:11px;padding:4px 9px;border-radius:7px;">Reset this day</button>'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:10px;">'+
      '<div id="caloriesRow" style="flex:1;min-width:0;"></div>'+
      '<div style="flex:0 0 42%;max-width:180px;padding-bottom:6px;">'+
        '<div style="height:4px;background:var(--surface-hi);border-radius:2px;overflow:hidden;">'+
          '<div style="height:100%;width:'+comp+'%;background:var(--'+s.accent+');"></div>'+
        '</div>'+
      '</div>'+
    '</div>';
  if(!isToday){
    document.getElementById('jumpToday').onclick = ()=>{ selectedDate = todayStr; weekOffset = 0; render(); };
  }
  document.getElementById('resetBtn').onclick = async ()=>{
    allSessionsForDate(selectedDate).forEach(s2=>{
      const rec = getDateRecord(s2.id, selectedDate);
      sessionLeaves(s2).forEach(ex=>{
        if(rec[ex.id]) rec[ex.id].sets = rec[ex.id].sets.slice(0, ex.sets).map(()=> blankSetEntry(ex));
      });
      rec._calories = null;
    });
    await saveData(); render();
  };
}

function renderSessionNote(){
  const dateRec = getDateRecord(currentSession, selectedDate);
  const ta = document.getElementById('sessionNote');
  ta.value = dateRec._note || '';
  ta.onchange = async ()=>{
    dateRec._note = ta.value;
    await saveData();
  };
}

function caloriesBadge(dateRec){
  const unit = dateRec._calorieUnit==='cal' ? 'Cal' : 'kCal';
  const prev = prevCaloriesFor(currentSession);
  if(dateRec._calories==null || dateRec._calories===''){
    return prev ? '<span style="font-size:11px;color:var(--text-faint);">last: '+prev.calories+' '+unit+'</span>' : '<span style="font-size:11px;color:var(--text-faint);">first time logging</span>';
  }
  if(!prev){
    return '<span style="font-size:11px;color:var(--text-faint);">first time logging</span>';
  }
  const diff = dateRec._calories - prev.calories;
  if(diff===0){
    return '<span style="font-size:11px;color:var(--text-faint);">same as last time ('+prev.calories+' '+unit+')</span>';
  }
  const up = diff>0;
  return '<span style="font-size:11px;color:'+(up?'var(--up)':'var(--down)')+';display:inline-flex;align-items:center;gap:2px;"><i class="ti ti-arrow-'+(up?'up':'down')+'" style="font-size:12px;"></i>'+(up?'+':'')+diff+' '+unit+' vs '+prev.calories+' last time</span>';
}

function renderCalories(){
  const dateRec = getDateRecord(currentSession, selectedDate);
  if(!dateRec._calorieUnit) dateRec._calorieUnit = data.calorieUnit || 'kcal';
  const unit = dateRec._calorieUnit;
  document.getElementById('caloriesRow').innerHTML =
    '<div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;">Calories burned</div>'+
    '<div style="display:flex;align-items:center;gap:8px;">'+
      '<input type="number" inputmode="numeric" id="caloriesInput" value="'+(dateRec._calories!=null?dateRec._calories:'')+'" placeholder="0" style="width:70px;height:34px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;padding:0 8px;">'+
      '<div style="display:flex;border:0.5px solid var(--line);border-radius:8px;overflow:hidden;">'+
        '<button data-unit="cal" style="background:'+(unit==='cal'?'var(--surface-hi)':'transparent')+';color:'+(unit==='cal'?'var(--text)':'var(--text-faint)')+';border:none;font-size:11px;padding:6px 9px;">Cal</button>'+
        '<button data-unit="kcal" style="background:'+(unit==='kcal'?'var(--surface-hi)':'transparent')+';color:'+(unit==='kcal'?'var(--text)':'var(--text-faint)')+';border:none;font-size:11px;padding:6px 9px;">kCal</button>'+
      '</div>'+
      caloriesBadge(dateRec)+
    '</div>';
  document.getElementById('caloriesInput').onchange = async (e)=>{
    const val = e.target.value==='' ? null : parseFloat(e.target.value);
    dateRec._calories = val;
    await saveData();
    render();
  };
  document.querySelectorAll('[data-unit]').forEach(btn=>{
    btn.onclick = async ()=>{
      dateRec._calorieUnit = btn.dataset.unit;
      data.calorieUnit = btn.dataset.unit;
      await saveData();
      render();
    };
  });
}

function weightBadge(sessionId, ex){
  const rec = getExRecord(sessionId, selectedDate, ex);
  const dispN = swapName(sessionId, ex);
  const def = defEquipFor(ex, dispN);
  const equip = activeEquipFor(rec, ex, dispN);
  const prev = prevWeightFor(sessionId, ex.id, equip, def, equipKind(ex));
  const u = data.weightUnit || 'lbs';
  if(rec.weight==null || rec.weight===''){
    return prev ? '<span style="font-size:11px;color:var(--text-faint);">last: '+prev.weight+' '+u+'</span>' : '<span style="font-size:11px;color:var(--text-faint);">first time logging</span>';
  }
  if(!prev){
    return '<span style="font-size:11px;color:var(--text-faint);">first time logging</span>';
  }
  const diff = rec.weight - prev.weight;
  if(diff===0){
    return '<span style="font-size:11px;color:var(--text-faint);">same as last time ('+prev.weight+' '+u+')</span>';
  }
  const up = diff>0;
  return '<span style="font-size:11px;color:'+(up?'var(--up)':'var(--down)')+';display:inline-flex;align-items:center;gap:2px;"><i class="ti ti-arrow-'+(up?'up':'down')+'" style="font-size:12px;"></i>'+(up?'+':'')+diff+' '+u+' vs '+prev.weight+' '+u+' last time</span>';
}
function maxWeightBadge(sessionId, ex){
  const rec = getExRecord(sessionId, selectedDate, ex);
  const dispN = swapName(sessionId, ex);
  const def = defEquipFor(ex, dispN);
  const equip = activeEquipFor(rec, ex, dispN);
  const best = bestMaxWeightFor(sessionId, ex.id, equip, def, equipKind(ex));
  const u = data.weightUnit || 'lbs';
  if(rec.maxWeight==null || rec.maxWeight===''){
    return best ? '<span style="font-size:11px;color:var(--text-faint);">best: '+best.weight+' '+u+'</span>' : '<span style="font-size:11px;color:var(--text-faint);">no max yet</span>';
  }
  if(!best){
    return '<span style="font-size:11px;color:var(--up);display:inline-flex;align-items:center;gap:3px;"><i class="ti ti-trophy" style="font-size:12px;"></i>first max</span>';
  }
  const diff = Number(rec.maxWeight) - best.weight;
  if(diff>0){
    return '<span style="font-size:11px;color:var(--up);display:inline-flex;align-items:center;gap:3px;"><i class="ti ti-trophy" style="font-size:12px;"></i>new PR &middot; +'+diff+' '+u+' vs '+best.weight+'</span>';
  }
  if(diff===0){
    return '<span style="font-size:11px;color:var(--text-faint);">ties best ('+best.weight+' '+u+')</span>';
  }
  return '<span style="font-size:11px;color:var(--text-faint);">best: '+best.weight+' '+u+'</span>';
}

const expandedOverrides = new Set();

function leafCardHTML(sessionId, ex, bg){
  const displayName = swapName(sessionId, ex);
  const color = 'var(--'+ex.muscle+')';
  const rec = getExRecord(sessionId, selectedDate, ex);
  if(!rec.removedSetIdx) rec.removedSetIdx = [];
  const isFullyComplete = targetSetCount(rec, ex) > 0 && completionCount(rec, ex) >= targetSetCount(rec, ex);
  const missingWeight = ex.w && (rec.weight==null || rec.weight==='');
  const cardKey = sessionId+'-'+ex.id+'-'+selectedDate;
  if(isFullyComplete && !missingWeight && !expandedOverrides.has(cardKey) && selectedDate===todayStr){
    return '<div style="background:'+bg+';border-radius:12px;padding:10px 12px;border-left:3px solid '+color+';display:flex;align-items:center;gap:8px;opacity:0.75;">'+
      '<i class="ti ti-check" style="font-size:15px;color:var(--up);flex:0 0 auto;"></i>'+
      '<span data-reorder="'+sessionId+'" title="Reorder exercises" style="cursor:pointer;display:inline-flex;align-items:center;gap:2px;font-size:9px;padding:2px 6px;border-radius:6px;background:'+color+';color:#121316;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;flex:0 0 auto;">'+MUSCLE_LABELS[ex.muscle]+'<i class="ti ti-arrows-sort" style="font-size:10px;"></i></span>'+
      '<div class="exname" style="font-size:15px;line-height:1;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+displayName.toUpperCase()+'</div>'+
      '<button data-expandcard="'+cardKey+'" style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);font-size:11px;padding:4px 8px;border-radius:7px;flex:0 0 auto;">Expand</button>'+
    '</div>';
  }
  let setsHtml='';
  rec.sets.forEach((entry,i)=>{
    const isExtra = i>=ex.sets;
    const isSkipped = !ex.timed && !isExtra && rec.removedSetIdx.includes(i);
    let caption;
    if(ex.timed){
      caption = '';
    } else if(isExtra){
      caption = '<button data-remove="'+ex.id+'" data-idx="'+i+'" style="font-size:9px;color:var(--text-faint);background:none;border:none;padding:0;">remove</button>';
    } else if(isSkipped){
      caption = '<button data-toggleset="'+ex.id+'" data-idx="'+i+'" style="font-size:9px;color:var(--up);background:none;border:none;padding:0;">restore</button>';
    } else {
      caption = '<button data-toggleset="'+ex.id+'" data-idx="'+i+'" style="font-size:9px;color:var(--text-faint);background:none;border:none;padding:0;">skip</button>';
    }
    if(ex.timed){
      const val = entry.duration;
      setsHtml += '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;opacity:'+(isSkipped?'0.4':'1')+';">'+
        (!ex.cardio ? '<button data-timer="'+ex.id+'" data-timeridx="'+i+'" title="Start / stop timer" style="height:28px;padding:0 11px;border-radius:8px;border:1.5px solid '+color+';background:var(--surface-hi);color:var(--text);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-bottom:2px;white-space:nowrap;"><i class="ti ti-clock" style="font-size:16px;"></i>Timer Start</button>' : '')+
        '<div style="display:flex;align-items:center;gap:3px;">'+
          '<input type="number" inputmode="numeric" data-duration="'+ex.id+'" data-idx="'+i+'" value="'+(val!=null?val:'')+'" placeholder="'+ex.target+'" '+(isSkipped?'disabled':'')+' style="width:48px;height:34px;text-align:center;background:'+(val? color : 'var(--surface-hi)')+';color:'+(val?'#121316':'var(--text)')+';border:1.5px solid '+color+';border-radius:9px;font-size:12px;font-weight:600;padding:0;">'+
          '<span style="font-size:10px;color:var(--text-faint);">'+ex.unit+'</span>'+
        '</div>'+
        caption+
      '</div>';
    } else {
      const val = entry.reps;
      setsHtml += '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;opacity:'+(isSkipped?'0.4':'1')+';">'+
        '<input type="number" inputmode="numeric" data-reps="'+ex.id+'" data-idx="'+i+'" value="'+(val!=null?val:'')+'" placeholder="'+ex.reps+'" '+(isSkipped?'disabled':'')+' style="width:44px;height:34px;text-align:center;background:'+(val? color : 'var(--surface-hi)')+';color:'+(val?'#121316':'var(--text)')+';border:1.5px solid '+color+';border-radius:9px;font-size:12px;font-weight:600;padding:0;">'+
        caption+
      '</div>';
    }
  });
  if(!ex.timed){
    setsHtml += '<button data-addset="'+ex.id+'" aria-label="Add set" style="width:34px;height:34px;border-radius:9px;border:1.5px dashed var(--line);background:transparent;color:var(--text-faint);font-size:16px;align-self:flex-start;"><i class="ti ti-plus"></i></button>';
  }
  if(ex.cardio){
    setsHtml += '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">'+
      '<div style="display:flex;align-items:center;gap:3px;">'+
        '<input type="number" inputmode="decimal" step="0.5" data-incline="'+ex.id+'" value="'+(rec.incline!=null?rec.incline:'')+'" placeholder="N/A" style="width:44px;height:34px;text-align:center;background:var(--surface-hi);border:1.5px solid var(--line);border-radius:9px;color:var(--text);font-size:12px;font-weight:600;padding:0;">'+
        '<span style="font-size:10px;color:var(--text-faint);">Incline</span>'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">'+
      '<div style="display:flex;align-items:center;gap:3px;">'+
        '<input type="number" inputmode="decimal" step="0.5" data-speed="'+ex.id+'" value="'+(rec.speed!=null?rec.speed:'')+'" placeholder="N/A" style="width:44px;height:34px;text-align:center;background:var(--surface-hi);border:1.5px solid var(--line);border-radius:9px;color:var(--text);font-size:12px;font-weight:600;padding:0;">'+
        '<span style="font-size:10px;color:var(--text-faint);">Speed/Level</span>'+
      '</div>'+
    '</div>';
  }

  const wUnit = data.weightUnit || 'lbs';
  const wStep = wUnit==='kg'?'1':'2.5';
  const mwNum = (rec.maxWeight!=null && rec.maxWeight!=='') ? Number(rec.maxWeight) : null;
  const roundToStep = v => { const st = wUnit==='kg'?1:2.5; return Math.round(v/st)*st; };
  const effEquip = activeEquipFor(rec, ex, displayName);
  const isBarbell = /barbell/i.test(effEquip) || /^bb[\s-]/i.test(displayName);
  const barW = (rec.barWeight!=null && rec.barWeight!=='') ? Number(rec.barWeight) : null;
  const wNum = (rec.weight!=null && rec.weight!=='') ? Number(rec.weight) : null;
  const signed = isSignedWeight(ex, effEquip);
  let workingHint;
  if(signed){
    workingHint = '+ weight added (belt), - assisted (band); blank = bodyweight';
  } else if(mwNum==null){
    workingHint = '60-80% of max weight unless otherwise specified';
  } else if(isBarbell && barW!=null){
    const plLo = Math.max(0, roundToStep(mwNum*0.6 - barW));
    const plHi = Math.max(0, roundToStep(mwNum*0.8 - barW));
    workingHint = plLo+'-'+plHi+' '+wUnit+' in plates (60-80% of max, plus '+barW+' '+wUnit+' bar)';
  } else if(isBarbell){
    workingHint = roundToStep(mwNum*0.6)+'-'+roundToStep(mwNum*0.8)+' '+wUnit+' total (60-80% of max; enter bar weight for plate target)';
  } else {
    workingHint = roundToStep(mwNum*0.6)+'-'+roundToStep(mwNum*0.8)+' '+wUnit+', 60-80% of max unless otherwise specified';
  }
  const workingTotal = (wNum!=null) ? (wNum + (barW||0)) : null;
  const barSection = (ex.w && isBarbell) ?
    '<div style="font-size:10px;color:var(--text-faint);letter-spacing:0.05em;margin:10px 0 4px;"><span style="text-transform:uppercase;">Bar weight</span> <span style="text-transform:none;">(optional &mdash; plates entered above are the working weight)</span></div>'+
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'+
      '<input type="number" inputmode="decimal" step="'+wStep+'" data-barweight="'+ex.id+'" value="'+(rec.barWeight!=null?rec.barWeight:'')+'" placeholder="'+(wUnit==='kg'?'20':'45')+'" style="width:64px;height:32px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;padding:0 8px;">'+
      '<span style="font-size:10px;color:var(--text-faint);">'+wUnit+'</span>'+
      (barW!=null && workingTotal!=null ? '<span style="font-size:11px;color:var(--text-dim);">Total lifted: '+workingTotal+' '+wUnit+' (plates + bar)</span>' : '')+
    '</div>' : '';
  const maxLabel = signed ? 'Best set (+ added / - assisted)' : 'Max weight (top set)';
  const workLabel = signed ? 'Added weight' : 'Working weight';
  const wPlace = signed ? '+/- '+wUnit : wUnit;
  // On the bar, entry is signed; a compact toggle flips added/assisted so a phone
  // decimal keypad (no minus key) can still record assistance.
  const signBtn = which => signed ? '<button data-negate="'+ex.id+'|'+which+'" title="Flip added / assisted" style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);font-size:14px;height:32px;width:34px;border-radius:8px;flex:0 0 auto;">&plusmn;</button>' : '';
  const weightRow = exIsWeighted(ex) ?
    '<div style="margin-top:10px;">'+
      '<div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">'+maxLabel+'</div>'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">'+
        '<input type="number" inputmode="decimal" step="'+wStep+'" data-maxweight="'+ex.id+'" value="'+(rec.maxWeight!=null?rec.maxWeight:'')+'" placeholder="'+wPlace+'" style="width:64px;height:32px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;padding:0 8px;">'+
        signBtn('max')+
        maxWeightBadge(sessionId, ex)+
      '</div>'+
      '<div style="font-size:10px;color:var(--text-faint);letter-spacing:0.05em;margin-bottom:4px;"><span style="text-transform:uppercase;">'+workLabel+'</span> <span style="text-transform:none;">('+workingHint+')</span></div>'+
      '<div style="display:flex;align-items:center;gap:8px;">'+
        '<input type="number" inputmode="decimal" step="'+wStep+'" data-weight="'+ex.id+'" value="'+(rec.weight!=null?rec.weight:'')+'" placeholder="'+wPlace+'" style="width:64px;height:32px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;padding:0 8px;">'+
        signBtn('work')+
        '<div style="display:flex;border:0.5px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto;">'+
          '<button data-wunit="lbs" style="background:'+(wUnit==='lbs'?'var(--surface-hi)':'transparent')+';color:'+(wUnit==='lbs'?'var(--text)':'var(--text-faint)')+';border:none;font-size:11px;padding:6px 9px;">lbs</button>'+
          '<button data-wunit="kg" style="background:'+(wUnit==='kg'?'var(--surface-hi)':'transparent')+';color:'+(wUnit==='kg'?'var(--text)':'var(--text-faint)')+';border:none;font-size:11px;padding:6px 9px;">kg</button>'+
        '</div>'+
        weightBadge(sessionId, ex)+
      '</div>'+
      barSection+
    '</div>' : '';


  return '<div style="background:'+bg+';border-radius:12px;padding:12px;border-left:3px solid '+color+';">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'+
      '<div>'+
        '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;">'+
          '<span data-reorder="'+sessionId+'" title="Reorder exercises" style="cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:6px;background:'+color+';color:#121316;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;">'+MUSCLE_LABELS[ex.muscle]+'<i class="ti ti-arrows-sort" style="font-size:11px;"></i></span>'+
          '<select data-equipment="'+ex.id+'" data-curequip="'+effEquip+'" data-kind="'+equipKind(ex)+'" style="font-size:10px;color:var(--text);font-style:normal;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:6px;padding:2px 5px;">'+
            equipOptionsFor(ex).map(opt=>'<option value="'+opt+'"'+(effEquip===opt?' selected':'')+'>'+opt+'</option>').join('')+
          '</select>'+
        '</div>'+
        '<div class="exname" style="font-size:19px;line-height:1;">'+displayName.toUpperCase()+'</div>'+
        '<div style="font-size:12px;color:var(--text-dim);margin-top:4px;">'+(ex.timed? ex.sets+' sets &times; '+ex.target+' '+ex.unit : ex.sets+' sets &times; '+ex.reps+' reps')+'</div>'+
        (ex.note? '<div style="font-size:11px;color:var(--text-faint);font-style:italic;margin-top:3px;">'+ex.note+'</div>' : '')+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px;flex:0 0 auto;align-items:flex-end;">'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">'+

// Apply a saved custom order to a list of {key,...} blocks; unknown/new blocks keep natural order at the end.
function orderBlocks(sid, blocks){
  const ord = (data.exerciseOrder && data.exerciseOrder[sid]) || null;
  if(!ord || !ord.length) return blocks;
  const byKey = {}; blocks.forEach(b=> byKey[b.key]=b);
  const used = {}; const out=[];
  ord.forEach(k=>{ if(byKey[k] && !used[k]){ out.push(byKey[k]); used[k]=1; } });
  blocks.forEach(b=>{ if(!used[b.key]) out.push(b); });
  return out;
}
// The reorderable blocks of a session (singles, supersets, standalone customs) with display labels, in current order.
function sessionBlockList(sid){
  const s = getSessionObj(sid); if(!s) return [];
  const customList = getCustomList(sid).filter(ex=> !isRemoved(sid, ex.id));
  const pairedMap = {}; const standaloneCustoms=[];
  customList.forEach(ex=>{ if(ex.pairedWith){ (pairedMap[ex.pairedWith]=pairedMap[ex.pairedWith]||[]).push(ex);} else standaloneCustoms.push(ex); });
  const nameOf = ex => swapName(sid, ex);
  const blocks=[];
  s.items.forEach((item, ii)=>{
    if(item.type==='single'){
      if(isRemoved(sid, item.ex.id)) return;
      const pairs = pairedMap[item.ex.id]||[];
      blocks.push({key:'i:'+item.ex.id, label: pairs.length? (nameOf(item.ex)+' + '+pairs.map(nameOf).join(' + ')) : nameOf(item.ex)});
    } else {
      const visibleSubs = item.subs.filter(sub=> !isRemoved(sid, sub.id));
      if(!visibleSubs.length) return;
      const allSubs=[]; visibleSubs.forEach(sub=>{ allSubs.push(sub); (pairedMap[sub.id]||[]).forEach(p=>allSubs.push(p)); });
      blocks.push({key:'g:'+(item.id||('idx'+ii)), label:'Superset: '+allSubs.map(nameOf).join(' + ')});
    }
  });
  standaloneCustoms.forEach(ex=>{
    const pairs=pairedMap[ex.id]||[];
    blocks.push({key:'c:'+ex.id, label: pairs.length? (nameOf(ex)+' + '+pairs.map(nameOf).join(' + ')) : nameOf(ex)});
  });
  return orderBlocks(sid, blocks);
}
function openReorder(sid){
  const existing=document.getElementById('reorderOverlay'); if(existing) existing.remove();
  const overlay=document.createElement('div');
  overlay.id='reorderOverlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.82);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
  const title = (getSessionObj(sid)||{}).title || '';
  function draw(){
    const list = sessionBlockList(sid);
    overlay.innerHTML = '<div style="max-width:460px;width:100%;max-height:85vh;overflow:auto;background:var(--surface);border-radius:14px;padding:14px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'+
        '<div style="font-size:15px;font-weight:700;">Reorder exercises</div>'+
        '<button id="reorderDone" style="background:var(--surface-hi);border:0.5px solid var(--line);color:var(--text);font-size:12px;padding:6px 14px;border-radius:8px;font-weight:600;">Done</button>'+
      '</div>'+
      '<div style="font-size:11px;color:var(--text-faint);margin-bottom:12px;">'+wtEsc(title.toUpperCase())+'</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px;">'+
        list.map((b,i)=>
          '<div style="display:flex;align-items:center;gap:8px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:10px;padding:8px 10px;">'+
            '<span style="width:18px;flex:0 0 auto;font-size:12px;color:var(--text-faint);">'+(i+1)+'</span>'+
            '<span style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+wtEsc(b.label)+'</span>'+
            '<button data-mv="up" data-key="'+wtEsc(b.key)+'" '+(i===0?'disabled':'')+' style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);width:32px;height:32px;border-radius:8px;flex:0 0 auto;'+(i===0?'opacity:0.3;':'')+'"><i class="ti ti-chevron-up" style="font-size:15px;"></i></button>'+
            '<button data-mv="down" data-key="'+wtEsc(b.key)+'" '+(i===list.length-1?'disabled':'')+' style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);width:32px;height:32px;border-radius:8px;flex:0 0 auto;'+(i===list.length-1?'opacity:0.3;':'')+'"><i class="ti ti-chevron-down" style="font-size:15px;"></i></button>'+
          '</div>'
        ).join('')+
      '</div>';
    document.getElementById('reorderDone').onclick=()=>{ overlay.remove(); render(); };
    overlay.querySelectorAll('[data-mv]').forEach(btn=>{
      btn.onclick=async ()=>{
        const keys = sessionBlockList(sid).map(x=>x.key);
        const idx = keys.indexOf(btn.dataset.key);
        const j = idx + (btn.dataset.mv==='up'? -1 : 1);
        if(idx<0 || j<0 || j>=keys.length) return;
        const tmp=keys[idx]; keys[idx]=keys[j]; keys[j]=tmp;
        if(!data.exerciseOrder) data.exerciseOrder={};
        data.exerciseOrder[sid]=keys;
        await saveData();
        draw();
      };
    });
  }
  draw();
  document.body.appendChild(overlay);
  overlay.onclick=(e)=>{ if(e.target===overlay){ overlay.remove(); render(); } };
}

function renderExercises(){
  const s = getSessionObj(currentSession);
  let carriedAny = false;
  if(selectedDate === todayStr){
    sessionLeaves(s).forEach(ex=>{
      const rec = getExRecord(s.id, selectedDate, ex);
      // Resolve equipment first (carry forward the last-used equipment) so every
      // carry below is scoped to the correct equipment's history.
      const kind = equipKind(ex);
      const weighted = exIsWeighted(ex);
      const dispN = swapName(s.id, ex);
      const def = defEquipFor(ex, dispN);
      if(!rec.equipment){
        const prevEquip = prevExFieldFor(s.id, ex.id, 'equipment');
        if(prevEquip){ rec.equipment = normFor(prevEquip.value, kind); carriedAny = true; }
      }
      const equip = activeEquipFor(rec, ex, dispN);
      if(weighted && (rec.weight==null || rec.weight==='')){
        const prev = prevWeightFor(s.id, ex.id, equip, def, kind);
        if(prev){ rec.weight = prev.weight; carriedAny = true; }
      }
      if(weighted && (rec.maxWeight==null || rec.maxWeight==='')){
        const bestMax = bestMaxWeightFor(s.id, ex.id, equip, def, kind);
        if(bestMax){ rec.maxWeight = bestMax.weight; carriedAny = true; }
      }
      if(weighted && (rec.barWeight==null || rec.barWeight==='')){
        const prevBar = prevBucketFieldFor(s.id, ex.id, 'barWeight', equip, def, kind);
        if(prevBar){ rec.barWeight = prevBar.value; carriedAny = true; }
      }
      // Once a weighted exercise is completed, capture its working+bar total as the max if it's a new high.
      if(weighted && rec.weight!=null && rec.weight!==''){
        const exDone = targetSetCount(rec, ex) > 0 && completionCount(rec, ex) >= targetSetCount(rec, ex);
        if(exDone){
          const total = Number(rec.weight) + ((rec.barWeight!=null && rec.barWeight!=='') ? Number(rec.barWeight) : 0);
          if(rec.maxWeight==null || rec.maxWeight==='' || total > Number(rec.maxWeight)){
            rec.maxWeight = total; carriedAny = true;
          }
        }
      }
      if(ex.cardio){
        if(rec.incline==null || rec.incline===''){
          const prevInc = prevBucketFieldFor(s.id, ex.id, 'incline', equip, def, kind);
          if(prevInc){ rec.incline = prevInc.value; carriedAny = true; }
        }
        if(rec.speed==null || rec.speed===''){
          const prevSpd = prevBucketFieldFor(s.id, ex.id, 'speed', equip, def, kind);
          if(prevSpd){ rec.speed = prevSpd.value; carriedAny = true; }
        }
      }
    });
    if(carriedAny) saveData();
  }

  const customList = getCustomList(s.id).filter(ex=> !isRemoved(s.id, ex.id));
  const pairedMap = {};
  const standaloneCustoms = [];
  customList.forEach(ex=>{
    if(ex.pairedWith){ (pairedMap[ex.pairedWith] = pairedMap[ex.pairedWith]||[]).push(ex); }
    else { standaloneCustoms.push(ex); }
  });

  function supersetWrapperHTML(subs, roundsLabel){
    const muscles = [...new Set(subs.map(x=>x.muscle))];
    const dots = muscles.map(m=>'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--'+m+');"></span>').join('');
    let subHtml = subs.map(sub=> leafCardHTML(s.id, sub, 'var(--surface-hi)')).join('');
    return '<div style="background:var(--surface);border-radius:12px;padding:10px;border:1px dashed var(--line);">'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:0 2px;">'+
        '<i class="ti ti-repeat" style="font-size:13px;color:var(--text-dim);"></i>'+
        '<span style="font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;">Superset'+(roundsLabel? ' &middot; '+roundsLabel+' rounds' : '')+'</span>'+
        '<span style="margin-left:auto;display:flex;gap:4px;">'+dots+'</span>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:8px;">'+subHtml+'</div>'+
    '</div>';
  }

  const blocks=[];
  s.items.forEach((item, ii)=>{
    if(item.type==='single'){
      if(isRemoved(s.id, item.ex.id)) return;
      const pairs = pairedMap[item.ex.id]||[];
      const h = pairs.length===0 ? leafCardHTML(s.id, item.ex, 'var(--surface)') : supersetWrapperHTML([item.ex, ...pairs], item.ex.sets);
      blocks.push({key:'i:'+item.ex.id, html:h});
    } else {
      const visibleSubs = item.subs.filter(sub=> !isRemoved(s.id, sub.id));
      if(visibleSubs.length===0) return;
      const allSubs = [];
      visibleSubs.forEach(sub=>{ allSubs.push(sub); (pairedMap[sub.id]||[]).forEach(p=> allSubs.push(p)); });
      const muscles = [...new Set(allSubs.map(x=>x.muscle))];
      const dots = muscles.map(m=>'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--'+m+');"></span>').join('');
      let subHtml='';
      allSubs.forEach(sub=>{ subHtml += leafCardHTML(s.id, sub, 'var(--surface-hi)'); });
      const h = '<div style="background:var(--surface);border-radius:12px;padding:10px;border:1px dashed var(--line);">'+
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:0 2px;">'+
          '<i class="ti ti-repeat" style="font-size:13px;color:var(--text-dim);"></i>'+

        '<div style="display:flex;flex-direction:column;gap:8px;">'+subHtml+'</div>'+
      '</div>';
      blocks.push({key:'g:'+(item.id||('idx'+ii)), html:h});
    }
  });
  standaloneCustoms.forEach(ex=>{
    const pairs = pairedMap[ex.id]||[];
    const h = pairs.length===0 ? leafCardHTML(s.id, ex, 'var(--surface)') : supersetWrapperHTML([ex, ...pairs], ex.sets);
    blocks.push({key:'c:'+ex.id, html:h});

  let html = orderBlocks(s.id, blocks).map(b=>b.html).join('');

  html += '<button id="addExerciseBtn" style="background:transparent;border:1.5px dashed var(--line);color:var(--text-dim);font-size:13px;padding:12px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;"><i class="ti ti-plus" style="font-size:15px;"></i>Add exercise</button>';

  const removedInSession = sessionLeaves(s).filter(ex=> isRemoved(s.id, ex.id));
  if(removedInSession.length){
    html += '<div style="background:var(--surface);border-radius:12px;padding:10px;border:0.5px dashed var(--line);">'+
      '<div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">Removed from this session</div>'+

  document.getElementById('exerciseList').innerHTML = html;

  document.querySelectorAll('[data-unremove]').forEach(b=>{

      if(alreadyComplete){
        rec.sets.forEach((entry,i)=>{
          if(rec.removedSetIdx.includes(i)) return;
          if(ex.timed){ entry.duration = null; } else { entry.reps = null; }
        });
      } else {
        let targetVal;
        if(ex.timed){
          targetVal = ex.target;
        } else {
          const nums = (ex.reps.match(/\d+/g)||['10']).map(Number);
          targetVal = nums[nums.length-1];
        }
        rec.sets.forEach((entry,i)=>{
          if(rec.removedSetIdx.includes(i)) return;
          if(ex.timed){ if(entry.duration==null || entry.duration==='') entry.duration = targetVal; }
          else { if(entry.reps==null || entry.reps==='') entry.reps = targetVal; }
        });
      }
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-clearex]').forEach(btn=>{
    btn.onclick = async ()=>{
      const exId = btn.dataset.clearex;
      const s = getSessionObj(currentSession);
      const ex = sessionLeaves(s).find(e=>e.id===exId);
      if(!ex) return;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      if(rec && Array.isArray(rec.sets)){
        rec.sets = rec.sets.slice(0, ex.sets).map(()=> blankSetEntry(ex));
      }
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-expandcard]').forEach(btn=>{
    btn.onclick = ()=>{
      expandedOverrides.add(btn.dataset.expandcard);
      render();
    };
  });
  document.querySelectorAll('[data-collapsecard]').forEach(btn=>{
    btn.onclick = ()=>{
      expandedOverrides.delete(btn.dataset.collapsecard);
      render();
    };
  });
  document.querySelectorAll('[data-swap]').forEach(btn=>{
    btn.onclick = ()=> openSwapMenu(btn.dataset.swap, btn.dataset.muscle, btn.dataset.orig);
  });
  document.querySelectorAll('[data-reorder]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openReorder(el.dataset.reorder); };
  });
  document.querySelectorAll('[data-skipex]').forEach(b=>{
    b.onclick = async ()=>{ editRemoved()[b.dataset.skipex] = true; await saveData(); render(); };
  });
  document.querySelectorAll('[data-photo]').forEach(btn=>{
    btn.onclick = ()=> openPhoto(btn.dataset.photo);
  });
  document.querySelectorAll('[data-note]').forEach(ta=>{
    ta.onchange = async ()=>{
      const exId = ta.dataset.note;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.userNote = ta.value;
      await saveData();
    };
  });
}

function firstFocusExId(){
  const s=getSessionObj(currentSession); if(!s) return null;
  const leaves=sessionLeaves(s).filter(ex=> !isRemoved(s.id, ex.id));
  if(!leaves.length) return null;
  const info=leaves.map(ex=>{
    const rec=getExRecord(s.id, selectedDate, ex);
    return {ex, done:completionCount(rec, ex), target:targetSetCount(rec, ex)};
  });
  let lastStarted=-1;
  info.forEach((it,i)=>{ if(it.done>0) lastStarted=i; });
  // next un-started AFTER your latest progress
  for(let i=Math.max(0,lastStarted+1); i<info.length; i++){ if(info[i].done===0) return info[i].ex.id; }
  // otherwise any un-started you skipped earlier
  for(let i=0;i<info.length;i++){ if(info[i].done===0) return info[i].ex.id; }
  // otherwise the first partially-done one
  for(let i=0;i<info.length;i++){ if(info[i].target>0 && info[i].done<info[i].target) return info[i].ex.id; }
  return null;
}
function focusFirstUnstarted(){
  const s=getSessionObj(currentSession); if(!s) return;
  const leaves=sessionLeaves(s).filter(ex=> !isRemoved(s.id, ex.id));
  const exId=firstFocusExId();
  if(!exId || (leaves.length && exId===leaves[0].id)){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  let sel;
  try{ sel='#exerciseList [data-reps="'+CSS.escape(exId)+'"], #exerciseList [data-duration="'+CSS.escape(exId)+'"]'; }
  catch(e){ sel='#exerciseList [data-reps="'+exId+'"], #exerciseList [data-duration="'+exId+'"]'; }
  const el=document.querySelector(sel);
  if(!el){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  const card=el.closest('#exerciseList > div') || el;
  const header=document.getElementById('sessionHeader');
  const offset=(header? header.getBoundingClientRect().height : 0) + 14;
  const y=card.getBoundingClientRect().top + window.pageYOffset - offset;
  window.scrollTo({top: Math.max(0, y), behavior:'smooth'});
}

var plankTimer = null;
function fmtTimer(sec){ var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
function renderTimerBtn(){
  if(!plankTimer) return;
  var el = document.querySelector('[data-timer="'+plankTimer.exId+'"][data-timeridx="'+plankTimer.idx+'"]');
  if(el){
    var sec = Math.floor((Date.now()-plankTimer.startMs)/1000);
    el.innerHTML = '<i class="ti ti-player-stop-filled" style="font-size:13px;"></i>Timer Stop &middot; '+fmtTimer(sec);
    el.style.background='var(--down)'; el.style.color='#121316'; el.style.borderColor='var(--down)';
  }
}
function startPlankTimer(exId, idx){
  if(plankTimer){ clearInterval(plankTimer.interval); plankTimer=null; }
  plankTimer = { exId:exId, idx:idx, startMs:Date.now(), interval:null };
  plankTimer.interval = setInterval(renderTimerBtn, 250);
  renderTimerBtn();
}
async function stopPlankTimer(){
  if(!plankTimer) return;
  clearInterval(plankTimer.interval);
  var t = plankTimer; plankTimer = null;
  var sec = Math.round((Date.now()-t.startMs)/1000);
  var rec = getDateRecord(currentSession, selectedDate)[t.exId];
  if(rec && rec.sets && rec.sets[t.idx]){ rec.sets[t.idx].duration = sec; await saveData(); }
  render();
}
function render(){
  const isFixed = SESSIONS.some(s=>s.id===currentSession);
  const isExtraForThisDate = getExtrasForDate(selectedDate).some(w=>w.id===currentSession);
  if(!isFixed && !isExtraForThisDate){ currentSession = SESSIONS[0].id; }
  renderWeekRing();
  renderWeekStrip();
  renderDayTabs();
  renderSessionHeader();
  renderCalories();
  renderSessionNote();
  renderExercises();
}

document.addEventListener('focusin', (e)=>{
  const t = e.target;
  if(t.tagName!=='INPUT' || t.type!=='number') return;
  const isDur = t.dataset.duration!=null;
  const exId = t.dataset.reps!=null ? t.dataset.reps : (isDur ? t.dataset.duration : null);
  if(exId!=null && (t.value==='' || t.value==null)){
    const s = getSessionObj(currentSession);
    const ex = s ? sessionLeaves(s).find(x=>x.id===exId) : null;
    if(ex){
      let targetVal;
      if(isDur){ targetVal = ex.target; }
      else { const nums=(String(ex.reps).match(/\d+/g)||['10']).map(Number); targetVal = nums[nums.length-1]; }
      if(targetVal!=null && targetVal!==''){
        t.value = targetVal;
        const idx = parseInt(t.dataset.idx);
        const rec = getDateRecord(currentSession, selectedDate)[exId];
        if(rec && Array.isArray(rec.sets) && rec.sets[idx]){
          if(isDur) rec.sets[idx].duration = targetVal; else rec.sets[idx].reps = targetVal;
          saveData();
        }
        const color = 'var(--'+ex.muscle+')';
        t.style.background = color; t.style.color = '#121316';
      }
    }
  } else if(t.dataset.weight!=null && (t.value==='' || t.value==null)){
    const exId = t.dataset.weight;
    const s = getSessionObj(currentSession);
    const ex = s ? sessionLeaves(s).find(x=>x.id===exId) : null;
    const container = getDateRecord(currentSession, selectedDate)[exId];
    const dispN = ex ? swapName(currentSession, ex) : null;
    const def = defEquipFor(ex, dispN);
    const equip = activeEquipFor(container, ex, dispN);
    const prev = prevWeightFor(currentSession, exId, equip, def, equipKind(ex));
    if(prev && prev.weight!=null && prev.weight!==''){
      t.value = prev.weight;
      if(container){ container.weight = prev.weight; saveData(); }
    }
  }
});
// Single click/tap just fills & completes the set; double-click selects all to edit
document.addEventListener('dblclick', (e)=>{
  const t = e.target;
  if(t.tagName==='INPUT' && t.type==='number') t.select();
});

wtAuth.onAuthStateChanged(function(user){
  if(!user){ location.replace('index.html'); return; }
  WT_UID = user.uid;
  WT_NAME = user.displayName || (user.email ? user.email.split('@')[0] : 'Me');
  CACHE_KEY = 'wtcache::' + WT_UID + '::' + PHASE;
  loadData();
});
</script>
