function guessEquipment(name){
  const n = (name||'').toLowerCase();
  if(n.includes('cable')) return 'Cable';
  if(n.includes('machine')) return 'Machine';
  if(n.includes('dumbbell') || n.includes('kettlebell') || n.includes('plate') || n.includes('ez bar')) return 'Free Weights';
  if(n.includes('bench')) return 'Bench';
  if(n.includes('barbell') || n.includes('squat') || n.includes('deadlift') || n.includes('rack pull') || n.includes('military press') || n.includes('pendlay')) return 'Barbell/Rack';
  if(['sit up','plank','leg raise','mountain climber','flutter kick','push up','glute bridge'].some(k=>n.includes(k))) return 'Floor';
  if(['pull up','chin up','dip,','burpee','concentration curl'].some(k=>n.includes(k))) return 'Other';
  if(n.includes('bike') || n.includes('treadmill') || n.includes('elliptical')) return 'Machine';
  return 'Other';
}

function findExtraWorkout(id){
  for(const d in data.extraWorkouts){
    const w = (data.extraWorkouts[d]||[]).find(x=>x.id===id);
    if(w) return w;
  }
  return null;
}

function getSessionObj(id){
  const fixed = SESSIONS.find(s=>s.id===id);
  if(fixed) return fixed;
  const w = findExtraWorkout(id);
  if(w) return {id:w.id, title:w.title, accent:w.accent, items:[]};
  return null;
}

function getExtrasForDate(dateStr){
  if(!data.extraWorkouts[dateStr]) data.extraWorkouts[dateStr] = [];
  return data.extraWorkouts[dateStr];
}

function allSessionsForDate(dateStr){
  const extras = getExtrasForDate(dateStr).map(w=> ({id:w.id, title:w.title, accent:w.accent, items:[]}));
  return [...SESSIONS, ...extras];
}

function sessionLeaves(s){
  let leaves=[];
  s.items.forEach(it=>{
    if(it.type==='single') leaves.push(it.ex);
    else leaves.push(...it.subs);
  });
  leaves.push(...getCustomList(s.id));
  return leaves;
}

function getCustomList(sessionId){
  if(!data.customExercises) data.customExercises = {};
  if(!data.customExercises[sessionId]) data.customExercises[sessionId] = [];
  return data.customExercises[sessionId];
}

const todayStr = new Date().toISOString().slice(0,10);
let selectedDate = todayStr;
let weekOffset = 0;

function last7Days(){
  const days=[];
  const now = new Date();
  const sunday = new Date(now);
  sunday.setDate(now.getDate() - now.getDay() + weekOffset*7);
  for(let i=0;i<7;i++){
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

async function loadData(){
  try{
    const raw = localStorage.getItem(WT_KEY);
    if(raw){ data = JSON.parse(raw); }
  }catch(e){}
  if(!data.progress) data.progress = {};
  if(!data.swaps) data.swaps = {};
  if(!data.removed) data.removed = {};
  if(!data.customExercises) data.customExercises = {};
  if(!data.calorieUnit) data.calorieUnit = 'kcal';
  if(!data.extraWorkouts) data.extraWorkouts = {};
  render();
  requestAnimationFrame(focusFirstUnstarted);
}
async function saveData(){
  try{ localStorage.setItem(WT_KEY, JSON.stringify(data)); }catch(e){}
}

function blankSetEntry(ex){
  return ex.timed ? {duration:null} : {reps:null};
}
function getDateRecord(sessionId, dateStr){
  data.progress[sessionId] = data.progress[sessionId] || {};
  data.progress[sessionId][dateStr] = data.progress[sessionId][dateStr] || {};
  return data.progress[sessionId][dateStr];
}
function getExRecord(sessionId, dateStr, ex){
  const rec = getDateRecord(sessionId, dateStr);
  if(!rec[ex.id]){ rec[ex.id] = {sets:[], weight:null}; }
  const r = rec[ex.id];
  if(!Array.isArray(r.sets)) r.sets = [];
  while(r.sets.length < ex.sets){ r.sets.push(blankSetEntry(ex)); }
  r.sets = r.sets.map(entry=>{
    if(entry==null) return blankSetEntry(ex);
    if(typeof entry === 'boolean'){ return blankSetEntry(ex); }
    if(ex.timed && entry.done!==undefined && entry.duration===undefined){ return {duration: entry.done? ex.target : null}; }
    return entry;
  });
  if(r.weight===undefined) r.weight = null;
  if(!Array.isArray(r.removedSetIdx)) r.removedSetIdx = [];
  if(r.incline===undefined) r.incline = null;
  if(r.speed===undefined) r.speed = null;
  if(r.equipment===undefined) r.equipment = null;
  return r;
}

function prevWeightFor(sessionId, exId){
  const map = data.progress[sessionId] || {};
  const dates = Object.keys(map).filter(d=> d < selectedDate).sort().reverse();
  for(const d of dates){
    const rec = map[d][exId];
    if(rec && rec.weight!=null && rec.weight!==''){ return {weight:rec.weight, date:d}; }
  }
  return null;
}

function prevCaloriesFor(sessionId){
  const map = data.progress[sessionId] || {};
  const dates = Object.keys(map).filter(d=> d < selectedDate).sort().reverse();
  for(const d of dates){
    const rec = map[d];
    if(rec && rec._calories!=null && rec._calories!==''){ return {calories:rec._calories, date:d}; }
  }
  return null;
}

function prevExFieldFor(sessionId, exId, field){
  const map = data.progress[sessionId] || {};
  const dates = Object.keys(map).filter(d=> d < selectedDate).sort().reverse();
  for(const d of dates){
    const rec = map[d][exId];
    if(rec && rec[field]!=null && rec[field]!==''){ return {value:rec[field], date:d}; }
  }
  return null;
}

function exFieldBadge(sessionId, ex, field, unit){
  const prev = prevExFieldFor(sessionId, ex.id, field);
  const rec = getExRecord(sessionId, selectedDate, ex);
  const cur = rec[field];
  if(cur==null || cur===''){
    return prev ? '<span style="font-size:10px;color:var(--text-faint);">last: '+prev.value+' '+unit+'</span>' : '<span style="font-size:10px;color:var(--text-faint);">&mdash;</span>';
  }
  if(!prev){
    return '<span style="font-size:10px;color:var(--text-faint);">first time</span>';
  }
  const diff = cur - prev.value;
  if(diff===0){
    return '<span style="font-size:10px;color:var(--text-faint);">same as last</span>';
  }
  const up = diff>0;
  return '<span style="font-size:10px;color:'+(up?'var(--up)':'var(--down)')+';display:inline-flex;align-items:center;gap:2px;"><i class="ti ti-arrow-'+(up?'up':'down')+'" style="font-size:11px;"></i>'+(up?'+':'')+diff+' '+unit+' vs last</span>';
}

function completionCount(rec, ex){
  let done=0;
  const removedIdx = new Set(rec.removedSetIdx||[]);
  rec.sets.slice(0, ex.sets).forEach((entry,i)=>{
    if(removedIdx.has(i)) return;
    if(ex.timed){ if(entry.duration!=null && entry.duration!=='' && entry.duration>0) done++; }
    else { if(entry.reps!=null && entry.reps!=='' && entry.reps>0) done++; }
  });
  return done;
}

function targetSetCount(rec, ex){
  const removedIdx = new Set(rec && rec.removedSetIdx || []);
  let n = 0;
  for(let i=0;i<ex.sets;i++){ if(!removedIdx.has(i)) n++; }
  return n;
}

function sessionCompletionForDate(sessionId, dateStr){
  const session = getSessionObj(sessionId);
  const prog = (data.progress[sessionId] && data.progress[sessionId][dateStr]) || {};
  let totalSets=0, doneSets=0;
  sessionLeaves(session).forEach(ex=>{
    if(data.removed[sessionId+'-'+ex.id]) return;
    const rec = prog[ex.id];
    totalSets += targetSetCount(rec, ex);
    if(rec) doneSets += completionCount(rec, ex);
  });
  return totalSets? doneSets/totalSets : 0;
}

function weekSummary(){
  const days = last7Days();
  let anyComplete = 0;
  days.forEach(d=>{
    let done = allSessionsForDate(d).some(s=> sessionCompletionForDate(s.id,d) > 0 );
    if(done) anyComplete++;
  });
  return {days, anyComplete};
}

function trainingStats(){
  const allDates = new Set();
  Object.keys(data.progress).forEach(sessionId=>{
    Object.keys(data.progress[sessionId]||{}).forEach(d=> allDates.add(d));
  });
  let trained = 0;
  const trainedDates = [];
  allDates.forEach(d=>{
    if(allSessionsForDate(d).some(s=> sessionCompletionForDate(s.id,d) > 0)){ trained++; trainedDates.push(d); }
  });
  let spanDays = 0, firstDate = null, lastDate = null;
  if(trainedDates.length){
    trainedDates.sort();
    firstDate = trainedDates[0];
    lastDate = trainedDates[trainedDates.length-1];
    const msPerDay = 24*60*60*1000;
    spanDays = Math.round((new Date(lastDate+'T00:00:00') - new Date(firstDate+'T00:00:00'))/msPerDay) + 1;
  }
  return { trained, spanDays, untrained: Math.max(0, spanDays-trained), firstDate, lastDate };
}

function weeklyCaloriesTotal(){
  const {days} = weekSummary();
  let total = 0;
  days.forEach(d=>{
    allSessionsForDate(d).forEach(s=>{
      const rec = data.progress[s.id] && data.progress[s.id][d];
      if(rec && rec._calories!=null && rec._calories!==''){ total += Number(rec._calories); }
    });
  });
  return total;
}

  if(dateRec._calories==null || dateRec._calories===''){
    return prev ? '<span style="font-size:11px;color:var(--text-faint);">last: '+prev.calories+' '+unit+'</span>' : '<span style="font-size:11px;color:var(--text-faint);">first time logging</span>';
  }
  if(!prev){

  }

  if(diff===0){

          return '<select data-equipment="'+ex.id+'" style="font-size:10px;color:'+(isGuess?'var(--text-faint)':'var(--text)')+';font-style:'+(isGuess?'italic':'normal')+';background:var(--surface-hi);border:0.5px solid var(--line);border-radius:6px;padding:2px 5px;margin-top:4px;">'+
            EQUIPMENT_OPTIONS.map(opt=>'<option value="'+opt+'"'+(guessed===opt?' selected':'')+'>'+opt+(isGuess && guessed===opt? ' (suggested)':'')+'</option>').join('')+
          '</select>';
        })()+
        '<div style="font-size:12px;color:var(--text-dim);margin-top:4px;">'+(ex.timed? ex.sets+' sets &times; '+ex.target+' '+ex.unit : ex.sets+' sets &times; '+ex.reps+' reps')+'</div>'+
        (ex.note? '<div style="font-size:11px;color:var(--text-faint);font-style:italic;margin-top:3px;">'+ex.note+'</div>' : '')+
      '</div>'+
      '<div style="display:flex;gap:6px;flex:0 0 auto;">'+
        '<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(displayName+' exercise form')+'" target="_blank" rel="noopener" style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);font-size:11px;padding:5px 8px;border-radius:8px;display:flex;align-items:center;gap:4px;text-decoration:none;"><i class="ti ti-player-play" style="font-size:13px;"></i>Demo</a>'+
        (EXERCISE_IMAGES[sessionId+'-'+ex.id]!=null? '<button data-photo="'+sessionId+'-'+ex.id+'" style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);font-size:11px;padding:5px 8px;border-radius:8px;display:flex;align-items:center;gap:4px;"><i class="ti ti-photo" style="font-size:13px;"></i>Photo</button>' : '')+
        '<button data-swap="'+sessionId+'-'+ex.id+'" data-muscle="'+ex.muscle+'" data-orig="'+ex.name+'" style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);font-size:11px;padding:5px 8px;border-radius:8px;display:flex;align-items:center;gap:4px;"><i class="ti ti-repeat" style="font-size:13px;"></i>Swap</button>'+
        '<button data-forcecomplete="'+ex.id+'" style="background:'+(isFullyComplete?'var(--up)':'transparent')+';border:0.5px solid '+(isFullyComplete?'var(--up)':'var(--line)')+';color:'+(isFullyComplete?'#121316':'var(--text-dim)')+';font-size:11px;padding:5px 8px;border-radius:8px;display:flex;align-items:center;gap:4px;font-weight:'+(isFullyComplete?'600':'400')+';"><i class="ti ti-check" style="font-size:13px;"></i>'+(isFullyComplete?'Completed':'Complete')+'</button>'+
        (isFullyComplete? '<button data-collapsecard="'+cardKey+'" style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);font-size:11px;padding:5px 8px;border-radius:8px;display:flex;align-items:center;gap:4px;"><i class="ti ti-chevron-up" style="font-size:13px;"></i>Minimize</button>' : '')+
      '</div>'+
    '</div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">'+
      (ex.timed? '<div style="width:100%;font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;">Actual duration</div>' : '')+
      setsHtml+
    '</div>'+
    weightRow+
    '<textarea data-note="'+ex.id+'" rows="1" placeholder="Add a note (form cues, how it felt, equipment used...)" style="width:100%;background:var(--bg);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;padding:6px 8px;margin-top:8px;resize:vertical;min-height:30px;font-family:\'Inter\',system-ui,sans-serif;">'+(rec.userNote||'')+'</textarea>'+
    '<button data-addpair="'+sessionId+'|||'+ex.id+'" style="background:none;border:none;color:var(--text-faint);font-size:11px;padding:6px 0 0;display:flex;align-items:center;gap:4px;"><i class="ti ti-plus" style="font-size:12px;"></i>Add superset / active recovery exercise</button>'+
  '</div>';
}

function renderExercises(){
  const s = getSessionObj(currentSession);
  let carriedAny = false;
  if(selectedDate === todayStr){
    sessionLeaves(s).forEach(ex=>{
      const rec = getExRecord(s.id, selectedDate, ex);
      if(ex.w && (rec.weight==null || rec.weight==='')){
        const prev = prevWeightFor(s.id, ex.id);
        if(prev){ rec.weight = prev.weight; carriedAny = true; }
      }
      if(ex.cardio){
        if(rec.incline==null || rec.incline===''){
          const prevInc = prevExFieldFor(s.id, ex.id, 'incline');
          if(prevInc){ rec.incline = prevInc.value; carriedAny = true; }
        }
        if(rec.speed==null || rec.speed===''){
          const prevSpd = prevExFieldFor(s.id, ex.id, 'speed');
          if(prevSpd){ rec.speed = prevSpd.value; carriedAny = true; }
        }
      }
      if(!rec.equipment){
        const prevEquip = prevExFieldFor(s.id, ex.id, 'equipment');
        if(prevEquip){ rec.equipment = prevEquip.value; carriedAny = true; }
      }
    });
    if(carriedAny) saveData();
  }

  const customList = getCustomList(s.id).filter(ex=> !data.removed[s.id+'-'+ex.id]);
  const pairedMap = {};
  const standaloneCustoms = [];
  customList.forEach(ex=>{
    if(ex.pairedWith){ (pairedMap[ex.pairedWith] = pairedMap[ex.pairedWith]||[]).push(ex); }
    else { standaloneCustoms.push(ex); }
  });

  function supersetWrapperHTML(subs, roundsLabel){
    const muscles = [...new Set(subs.map(x=>x.muscle))];
    const dots = muscles.map(m=>'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--'+m+');"></span>').join('');
    let subHtml = subs.map(sub=> leafCardHTML(s.id, sub, 'var(--surface-hi)')).join('');
    return '<div style="background:var(--surface);border-radius:12px;padding:10px;border:1px dashed var(--line);">'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:0 2px;">'+
        '<i class="ti ti-repeat" style="font-size:13px;color:var(--text-dim);"></i>'+
        '<span style="font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;">Superset'+(roundsLabel? ' &middot; '+roundsLabel+' rounds' : '')+'</span>'+
        '<span style="margin-left:auto;display:flex;gap:4px;">'+dots+'</span>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:8px;">'+subHtml+'</div>'+
    '</div>';
  }

  let html='';
  s.items.forEach(item=>{
    if(item.type==='single'){
      if(data.removed[s.id+'-'+item.ex.id]) return;
      const pairs = pairedMap[item.ex.id]||[];
      if(pairs.length===0){
        html += leafCardHTML(s.id, item.ex, 'var(--surface)');
      } else {
        html += supersetWrapperHTML([item.ex, ...pairs], item.ex.sets);
      }
    } else {
      const visibleSubs = item.subs.filter(sub=> !data.removed[s.id+'-'+sub.id]);
      if(visibleSubs.length===0) return;
      const allSubs = [];
      visibleSubs.forEach(sub=>{ allSubs.push(sub); (pairedMap[sub.id]||[]).forEach(p=> allSubs.push(p)); });
      const muscles = [...new Set(allSubs.map(x=>x.muscle))];
      const dots = muscles.map(m=>'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--'+m+');"></span>').join('');
      let subHtml='';
      allSubs.forEach(sub=>{ subHtml += leafCardHTML(s.id, sub, 'var(--surface-hi)'); });
      html += '<div style="background:var(--surface);border-radius:12px;padding:10px;border:1px dashed var(--line);">'+
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:0 2px;">'+
          '<i class="ti ti-repeat" style="font-size:13px;color:var(--text-dim);"></i>'+
          '<span style="font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;">Superset &middot; '+item.rounds+' rounds</span>'+
          '<span style="margin-left:auto;display:flex;gap:4px;">'+dots+'</span>'+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:8px;">'+subHtml+'</div>'+
      '</div>';
    }
  });

  standaloneCustoms.forEach(ex=>{
    const pairs = pairedMap[ex.id]||[];
    if(pairs.length===0){
      html += leafCardHTML(s.id, ex, 'var(--surface)');
    } else {
      html += supersetWrapperHTML([ex, ...pairs], ex.sets);
    }
  });

  html += '<button id="addExerciseBtn" style="background:transparent;border:1.5px dashed var(--line);color:var(--text-dim);font-size:13px;padding:12px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;"><i class="ti ti-plus" style="font-size:15px;"></i>Add exercise</button>';

  const removedInSession = sessionLeaves(s).filter(ex=> data.removed[s.id+'-'+ex.id]);
  if(removedInSession.length){
    html += '<div style="background:var(--surface);border-radius:12px;padding:10px;border:0.5px dashed var(--line);">'+
      '<div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">Removed from this session</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px;">'+
      removedInSession.map(ex=>
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">'+
          '<span style="font-size:12px;color:var(--text-dim);">'+((data.swaps[s.id+'-'+ex.id])||ex.name)+'</span>'+
          '<button data-unremove="'+s.id+'-'+ex.id+'" style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);font-size:11px;padding:4px 8px;border-radius:8px;">Restore</button>'+
        '</div>'
      ).join('')+
      '</div>'+
    '</div>';
  }
  document.getElementById('exerciseList').innerHTML = html;

  document.querySelectorAll('[data-unremove]').forEach(b=>{
    b.onclick = async ()=>{
      delete data.removed[b.dataset.unremove];
      await saveData(); render();
    };
  });
  document.getElementById('addExerciseBtn').onclick = ()=> openAddExerciseForm(s.id);
  document.querySelectorAll('[data-addpair]').forEach(btn=>{
    btn.onclick = ()=>{
      const [sid, exId] = btn.dataset.addpair.split('|||');
      openAddExerciseForm(sid, exId);
    };
  });

  document.querySelectorAll('[data-duration]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.duration, idx = parseInt(inp.dataset.idx);
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      const val = inp.value==='' ? null : parseFloat(inp.value);
      rec.sets[idx].duration = val;
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-reps]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.reps, idx = parseInt(inp.dataset.idx);
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      const val = inp.value==='' ? null : parseInt(inp.value);
      rec.sets[idx].reps = val;
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-weight]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.weight;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      const val = inp.value==='' ? null : parseFloat(inp.value);
      rec.weight = val;
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-equipment]').forEach(sel=>{
    sel.onchange = async ()=>{
      const exId = sel.dataset.equipment;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.equipment = sel.value || null;
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-incline]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.incline;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.incline = inp.value==='' ? null : parseFloat(inp.value);
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-speed]').forEach(inp=>{
    inp.onchange = async ()=>{
      const exId = inp.dataset.speed;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.speed = inp.value==='' ? null : parseFloat(inp.value);
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-addset]').forEach(btn=>{
    btn.onclick = async ()=>{
      const exId = btn.dataset.addset;
      const ex = sessionLeaves(s).find(x=>x.id===exId);
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.sets.push(blankSetEntry(ex));
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = async ()=>{
      const exId = btn.dataset.remove, idx = parseInt(btn.dataset.idx);
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.sets.splice(idx,1);
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-toggleset]').forEach(btn=>{
    btn.onclick = async ()=>{
      const exId = btn.dataset.toggleset, idx = parseInt(btn.dataset.idx);
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      if(!rec.removedSetIdx) rec.removedSetIdx = [];
      const pos = rec.removedSetIdx.indexOf(idx);
      if(pos>=0) rec.removedSetIdx.splice(pos,1); else rec.removedSetIdx.push(idx);
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-forcecomplete]').forEach(btn=>{
    btn.onclick = async ()=>{
      const exId = btn.dataset.forcecomplete;
      const s = getSessionObj(currentSession);
      const ex = sessionLeaves(s).find(e=>e.id===exId);
      if(!ex) return;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      if(!rec.removedSetIdx) rec.removedSetIdx = [];
      const alreadyComplete = targetSetCount(rec, ex) > 0 && completionCount(rec, ex) >= targetSetCount(rec, ex);
      if(alreadyComplete){
        rec.sets.forEach((entry,i)=>{
          if(rec.removedSetIdx.includes(i)) return;
          if(ex.timed){ entry.duration = null; } else { entry.reps = null; }
        });
      } else {
        let targetVal;
        if(ex.timed){
          targetVal = ex.target;
        } else {
          const nums = (ex.reps.match(/\d+/g)||['10']).map(Number);
          targetVal = nums[nums.length-1];
        }
        rec.sets.forEach((entry,i)=>{
          if(rec.removedSetIdx.includes(i)) return;
          if(ex.timed){ if(entry.duration==null || entry.duration==='') entry.duration = targetVal; }
          else { if(entry.reps==null || entry.reps==='') entry.reps = targetVal; }
        });
      }
      await saveData();
      render();
    };
  });
  document.querySelectorAll('[data-expandcard]').forEach(btn=>{
    btn.onclick = ()=>{
      expandedOverrides.add(btn.dataset.expandcard);
      render();
    };
  });
  document.querySelectorAll('[data-collapsecard]').forEach(btn=>{
    btn.onclick = ()=>{
      expandedOverrides.delete(btn.dataset.collapsecard);
      render();
    };
  });
  document.querySelectorAll('[data-swap]').forEach(btn=>{
    btn.onclick = ()=> openSwapMenu(btn.dataset.swap, btn.dataset.muscle, btn.dataset.orig);
  });
  document.querySelectorAll('[data-photo]').forEach(btn=>{
    btn.onclick = ()=> openPhoto(btn.dataset.photo);
  });
  document.querySelectorAll('[data-note]').forEach(ta=>{
    ta.onchange = async ()=>{
      const exId = ta.dataset.note;
      const rec = getDateRecord(currentSession, selectedDate)[exId];
      rec.userNote = ta.value;
      await saveData();
    };
  });
}

      '<button id="photoClose" style="background:transparent;border:0.5px solid var(--line);color:var(--text-dim);font-size:12px;padding:4px 9px;border-radius:8px;">Close</button>'+

      '</div>'+
      '<div>'+
        '<label style="font-size:11px;color:var(--text-faint);display:block;margin-bottom:4px;">Main focus (used for its color tag)</label>'+
        '<select id="newWorkoutAccent" style="width:100%;height:36px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;padding:0 8px;">'+muscleOptions+'</select>'+
      '</div>'+
      '<button id="newWorkoutSubmit" style="background:var(--legs);color:#121316;border:none;font-weight:600;font-size:14px;padding:10px;border-radius:10px;margin-top:4px;">Create workout</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  document.getElementById('addWorkoutClose').onclick = ()=> overlay.remove();

    '<div style="display:flex;flex-direction:column;gap:10px;">'+

      '</div>'+
      '<div>'+
        '<label style="font-size:11px;color:var(--text-faint);display:block;margin-bottom:4px;">Exercise name</label>'+
        '<input id="addName" type="text" placeholder="e.g. Cable Crunch" style="width:100%;height:36px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;padding:0 8px;">'+
      '</div>'+
      '<div>'+
        '<label style="font-size:11px;color:var(--text-faint);display:block;margin-bottom:4px;">Muscle focus</label>'+
        '<select id="addMuscle" style="width:100%;height:36px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;padding:0 8px;">'+muscleOptions+'</select>'+
      '</div>'+
      '<div style="display:flex;gap:10px;">'+
        '<div style="flex:1;">'+
          '<label style="font-size:11px;color:var(--text-faint);display:block;margin-bottom:4px;">Sets</label>'+
          '<input id="addSets" type="number" value="3" min="1" style="width:100%;height:36px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;padding:0 8px;">'+
        '</div>'+
        '<div style="flex:1;" id="addRepsWrap">'+
          '<label style="font-size:11px;color:var(--text-faint);display:block;margin-bottom:4px;">Target reps</label>'+
          '<input id="addReps" type="text" placeholder="e.g. 10 or 8-12" style="width:100%;height:36px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;padding:0 8px;">'+
        '</div>'+
        '<div style="flex:1;display:none;" id="addDurationWrap">'+
          '<label style="font-size:11px;color:var(--text-faint);display:block;margin-bottom:4px;">Target duration</label>'+
          '<div style="display:flex;gap:6px;">'+
            '<input id="addDuration" type="number" value="10" min="1" style="width:100%;height:36px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;padding:0 8px;">'+
            '<select id="addUnit" style="height:36px;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;"><option value="min">min</option><option value="sec">sec</option></select>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div style="display:flex;gap:16px;">'+
        '<label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px;"><input id="addTimed" type="checkbox">This is time-based (cardio, plank...)</label>'+
      '</div>'+
      '<div>'+
        '<label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px;"><input id="addWeight" type="checkbox">Track weight for this exercise</label>'+
      '</div>'+
      '<div>'+
        '<label style="font-size:11px;color:var(--text-faint);display:block;margin-bottom:4px;">Notes (optional)</label>'+
        '<textarea id="addNotes" rows="2" placeholder="Form cues, equipment, anything to remember" style="width:100%;background:var(--surface-hi);border:0.5px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;padding:6px 8px;resize:vertical;font-family:'+"'"+'Inter'+"'"+',system-ui,sans-serif;"></textarea>'+
      '</div>'+
      '<button id="addExSubmit" style="background:var(--legs);color:#121316;border:none;font-weight:600;font-size:14px;padding:10px;border-radius:10px;margin-top:4px;">'+(removeKey? 'Replace exercise' : 'Add to this session')+'</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  document.getElementById('addExClose').onclick = ()=> overlay.remove();

  document.getElementById('addDbPick').onchange = (e)=>{
    const v = e.target.value;
    if(!v) return;
    const [m,name] = v.split('|||');
    document.getElementById('addName').value = name;
    document.getElementById('addMuscle').value = m;
  };
  document.getElementById('addTimed').onchange = (e)=>{
    document.getElementById('addRepsWrap').style.display = e.target.checked ? 'none' : 'block';
    document.getElementById('addDurationWrap').style.display = e.target.checked ? 'block' : 'none';
  };

  document.getElementById('addExSubmit').onclick = async ()=>{
    const name = document.getElementById('addName').value.trim();
    if(!name){ document.getElementById('addName').style.borderColor = 'var(--down)'; return; }
    const muscle = document.getElementById('addMuscle').value;
    const sets = Math.max(1, parseInt(document.getElementById('addSets').value)||1);
    const timed = document.getElementById('addTimed').checked;
    const trackWeight = document.getElementById('addWeight').checked;
    const notes = document.getElementById('addNotes').value.trim();
    const ex = { id: 'c'+Date.now(), name, muscle, sets, w: trackWeight };
    if(timed){
      ex.timed = true;
      ex.target = Math.max(1, parseFloat(document.getElementById('addDuration').value)||10);
      ex.unit = document.getElementById('addUnit').value;
    } else {
      ex.reps = document.getElementById('addReps').value.trim() || '10';
    }
    if(notes) ex.note = notes;
    if(pairedWith) ex.pairedWith = pairedWith;
    getCustomList(sessionId).push(ex);
    if(removeKey) data.removed[removeKey] = true;
    await saveData();
    overlay.remove();
    render();
  };
}

let openSwapKey = null;
function getAllActiveExerciseNames(){
  const names = new Set();
  SESSIONS.forEach(s=>{
    sessionLeaves(s).forEach(ex=>{
      if(data.removed[s.id+'-'+ex.id]) return;
      names.add((data.swaps[s.id+'-'+ex.id]) || ex.name);
    });
  });
  return names;
}

function openSwapMenu(key, muscle, orig){
  const existing = document.getElementById('swapMenu');
  if(existing) existing.remove();
  if(openSwapKey===key){ openSwapKey=null; return; }
  openSwapKey = key;
  const opts = (MUSCLE_ALTS[muscle]||[]).filter(o=>o!==orig);
  const activeNames = getAllActiveExerciseNames();
  const available = opts.filter(o=> !activeNames.has(o)).sort((a,b)=> a.localeCompare(b));
  const inPlan = opts.filter(o=> activeNames.has(o)).sort((a,b)=> a.localeCompare(b));
  let html = '<div id="swapMenu" style="position:relative;background:var(--surface-hi);border-radius:10px;padding:10px;margin-top:-4px;margin-bottom:10px;border:0.5px solid var(--line);">'+
    '<div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">Swap for an alternative '+MUSCLE_LABELS[muscle]+' exercise</div>'+
    '<div style="display:flex;flex-direction:column;gap:6px;">'+
    '<button data-restore="'+key+'" style="text-align:left;background:transparent;border:0.5px solid var(--line);color:var(--text);font-size:13px;padding:7px 10px;border-radius:8px;">'+orig+' (original)</button>';
  available.forEach(o=>{
    html += '<button data-choose="'+key+'" data-name="'+o+'" style="text-align:left;background:transparent;border:0.5px solid var(--line);color:var(--text);font-size:13px;padding:7px 10px;border-radius:8px;">'+o+'</button>';
  });
  if(inPlan.length){
    html += '<div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;margin-top:6px;margin-bottom:2px;">Already in your plan</div>';
    inPlan.forEach(o=>{
      html += '<button data-choose="'+key+'" data-name="'+o+'" style="text-align:left;background:transparent;border:0.5px solid var(--line);color:var(--text-dim);font-size:13px;padding:7px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;">'+
        '<span>'+o+'</span><span style="font-size:9px;color:var(--text-faint);border:0.5px solid var(--line);padding:2px 6px;border-radius:6px;">in plan</span>'+
      '</button>';
    });
  }
  html += '<button data-customswap="'+key+'" style="text-align:left;background:transparent;border:0.5px dashed var(--line);color:var(--text-dim);font-size:13px;padding:7px 10px;border-radius:8px;margin-top:2px;display:flex;align-items:center;gap:6px;"><i class="ti ti-plus" style="font-size:14px;"></i>Fill in a custom exercise</button>'+
    '<button data-remove-ex="'+key+'" style="text-align:left;background:transparent;border:0.5px solid var(--down);color:var(--down);font-size:13px;padding:7px 10px;border-radius:8px;margin-top:2px;display:flex;align-items:center;gap:6px;"><i class="ti ti-trash" style="font-size:14px;"></i>Remove this exercise from my plan</button>';
  html += '</div></div>';
  const btn = document.querySelector('[data-swap="'+key+'"]');
  const card = btn.closest('div[style*="border-left"]');
  card.insertAdjacentHTML('afterend', html);
  document.querySelectorAll('[data-choose]').forEach(b=>{
    b.onclick = async ()=>{
      data.swaps[b.dataset.choose] = b.dataset.name;
      openSwapKey=null;
      await saveData(); render();
    };
  });
  document.querySelectorAll('[data-restore]').forEach(b=>{
    b.onclick = async ()=>{
      delete data.swaps[b.dataset.restore];
      openSwapKey=null;
      await saveData(); render();
    };
  });
  document.querySelectorAll('[data-remove-ex]').forEach(b=>{
    b.onclick = async ()=>{
      data.removed[b.dataset.removeEx] = true;
      openSwapKey=null;
      await saveData(); render();
    };
  });
  document.querySelectorAll('[data-customswap]').forEach(b=>{
    b.onclick = ()=>{
      const swapKey = b.dataset.customswap;
      const dashIdx = swapKey.indexOf('-');
      const sid = swapKey.slice(0, dashIdx);
      openSwapKey = null;
      const menu = document.getElementById('swapMenu');
      if(menu) menu.remove();
      openAddExerciseForm(sid, null, swapKey);
    };
  });
}

function firstFocusExId(){
  const s=getSessionObj(currentSession); if(!s) return null;
  const leaves=sessionLeaves(s).filter(ex=> !data.removed[s.id+'-'+ex.id]);
  if(!leaves.length) return null;
  const info=leaves.map(ex=>{
    const rec=getExRecord(s.id, selectedDate, ex);
    return {ex, done:completionCount(rec, ex), target:targetSetCount(rec, ex)};
  });
  let lastStarted=-1;
  info.forEach((it,i)=>{ if(it.done>0) lastStarted=i; });
  // next un-started AFTER your latest progress
  for(let i=Math.max(0,lastStarted+1); i<info.length; i++){ if(info[i].done===0) return info[i].ex.id; }
  // otherwise any un-started you skipped earlier
  for(let i=0;i<info.length;i++){ if(info[i].done===0) return info[i].ex.id; }
  // otherwise the first partially-done one
  for(let i=0;i<info.length;i++){ if(info[i].target>0 && info[i].done<info[i].target) return info[i].ex.id; }
  return null;
}
function focusFirstUnstarted(){
  const s=getSessionObj(currentSession); if(!s) return;
  const leaves=sessionLeaves(s).filter(ex=> !data.removed[s.id+'-'+ex.id]);
  const exId=firstFocusExId();
  if(!exId || (leaves.length && exId===leaves[0].id)){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  let sel;
  try{ sel='#exerciseList [data-reps="'+CSS.escape(exId)+'"], #exerciseList [data-duration="'+CSS.escape(exId)+'"]'; }
  catch(e){ sel='#exerciseList [data-reps="'+exId+'"], #exerciseList [data-duration="'+exId+'"]'; }
  const el=document.querySelector(sel);
  if(!el){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  const card=el.closest('#exerciseList > div') || el;
  const header=document.getElementById('sessionHeader');
  const offset=(header? header.getBoundingClientRect().height : 0) + 14;
  const y=card.getBoundingClientRect().top + window.pageYOffset - offset;
  window.scrollTo({top: Math.max(0, y), behavior:'smooth'});
}
function render(){
  const isFixed = SESSIONS.some(s=>s.id===currentSession);
  const isExtraForThisDate = getExtrasForDate(selectedDate).some(w=>w.id===currentSession);
  if(!isFixed && !isExtraForThisDate){ currentSession = SESSIONS[0].id; }
  renderWeekRing();
  renderWeekStrip();
  renderDayTabs();
  renderSessionHeader();
  renderCalories();
  renderSessionNote();
  renderExercises();
}

document.addEventListener('focusin', (e)=>{
  const t = e.target;
  if(t.tagName!=='INPUT' || t.type!=='number') return;
  const isDur = t.dataset.duration!=null;
  const exId = t.dataset.reps!=null ? t.dataset.reps : (isDur ? t.dataset.duration : null);
  if(exId!=null && (t.value==='' || t.value==null)){
    const s = getSessionObj(currentSession);
    const ex = s ? sessionLeaves(s).find(x=>x.id===exId) : null;
    if(ex){
      let targetVal;
      if(isDur){ targetVal = ex.target; }
      else { const nums=(String(ex.reps).match(/\d+/g)||['10']).map(Number); targetVal = nums[nums.length-1]; }
      if(targetVal!=null && targetVal!==''){
        t.value = targetVal;
        const idx = parseInt(t.dataset.idx);
        const rec = getDateRecord(currentSession, selectedDate)[exId];
        if(rec && Array.isArray(rec.sets) && rec.sets[idx]){
          if(isDur) rec.sets[idx].duration = targetVal; else rec.sets[idx].reps = targetVal;
          saveData();
        }
        const color = 'var(--'+ex.muscle+')';
        t.style.background = color; t.style.color = '#121316';
      }
    }
  } else if(t.dataset.weight!=null && (t.value==='' || t.value==null)){
    const prev = prevWeightFor(currentSession, t.dataset.weight);
    if(prev && prev.weight!=null && prev.weight!==''){
      t.value = prev.weight;
      const rec = getDateRecord(currentSession, selectedDate)[t.dataset.weight];
      if(rec){ rec.weight = prev.weight; saveData(); }
    }
  }
  t.select();
});

loadData();
